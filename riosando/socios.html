<style>

  *{box-sizing:border-box}
  body{margin:0;background:var(--preto);color:var(--papel);font-family:var(--texto);font-size:15px;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:24px 70px}
  h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
  .kicker{font-family:var(--display);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta3)}
  h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin-top:6px}
  /* gate */
  #gate{max-width:380px;margin:12vh auto;padding-inline:16px}
  #gate input{width:100%;font-family:inherit;font-size:16px;padding:12px;border:1px solid #3A3631;border-radius:10px;
              background:#221F1B;color:var(--papel);margin-top:8px}
  #gate button{width:100%;margin-top:14px;background:var(--vermelho);color:#fff;border:0;border-radius:10px;
               padding:13px;font-size:15px;font-family:var(--display);font-weight:600;letter-spacing:.04em;cursor:pointer}
  .erro{color:#E5705F;font-size:13.5px;min-height:18px;margin-top:10px}
  /* app */
  nav{display:flex;gap:6px;overflow-x:auto;margin:18px 0 4px;position:sticky;top:env(safe-area-inset-top,0px);
      background:var(--preto);padding-block:10px;z-index:3}
  nav button{font-family:var(--display);font-size:13.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
    background:none;border:1px solid #3A3631;color:var(--tinta3);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  nav button[aria-selected="true"]{background:var(--papel);color:var(--preto);border-color:var(--papel)}
  .carta{background:var(--carta);color:var(--preto);border-radius:14px;padding:18px;margin-top:14px}
  .alvo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .alvo .n{font-family:var(--display);font-size:46px;font-weight:600;line-height:.9;font-variant-numeric:tabular-nums}
  .bloco{border-top:1px solid var(--fio);padding-top:12px;margin-top:16px}
  .bloco h3{font-size:16px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .hora{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--vermelho)}
  .quem{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);border:1px solid var(--fio);
        padding:2px 8px;border-radius:999px}
  ul.t{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  ul.t li{padding-left:19px;position:relative;font-size:14.5px}
  ul.t li::before{content:"";position:absolute;left:0;top:7px;width:9px;height:9px;border:1.5px solid var(--tinta3);border-radius:2px}
  .tabwrap{overflow-x:auto;margin-top:10px}
  table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
  th{font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
     color:var(--tinta2);text-align:left;border-bottom:1px solid var(--preto);padding:6px 12px 6px 0;white-space:nowrap}
  td{border-bottom:1px solid var(--fio);padding:7px 12px 7px 0;vertical-align:middle}

       padding:3px 8px;border-radius:6px;color:#fff;white-space:nowrap}

  .pin.dom{background:var(--vermelho)} .pin.ex{background:var(--ocre)}

  .nota b{color:var(--preto)}
  .sair{position:absolute;right:16px;top:22px;background:none;border:1px solid #3A3631;color:var(--tinta3);
        border-radius:999px;padding:5px 12px;font-size:12px;font-family:var(--display);cursor:pointer}
  footer{margin-top:32px;border-top:1px solid #322E29;padding-top:14px;font-size:12.5px;color:var(--tinta3)}

/* ───────── login: mesmo Firebase do painel ───────── */
async function entrar(){
  const e = $("g-erro"); e.textContent = ""; $("g-btn").disabled = true;
  try{
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_KEY}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({email:$("g-mail").value.trim(),password:$("g-senha").value,returnSecureToken:true})});
    const d = await r.json();
    if(!r.ok) throw new Error(d?.error?.message || "erro");
    try{ localStorage.setItem("rs_socios", JSON.stringify({email:d.email, exp:Date.now()+12*36e5})); }catch(_){}
    abrir(d.email);
  }catch(err){
    const m = String(err.message||"");
    e.textContent = /EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN/.test(m) ? "E-mail ou senha não conferem."
                  : /TOO_MANY/.test(m) ? "Muitas tentativas. Espera um minuto." : "Não deu para entrar. Tenta de novo.";
  }finally{ $("g-btn").disabled = false; }
}
function sair(){ try{ localStorage.removeItem("rs_socios"); }catch(_){} location.reload(); }
$("g-btn").onclick = entrar;
$("g-senha").addEventListener("keydown", ev => { if(ev.key === "Enter") entrar(); });

function domingos(){                     // os domingos de outubro a dezembro
  const out = []; const d = new Date(2026,9,1);
  while(d.getFullYear() === 2026 && d.getMonth() <= 11){
    if(d.getDay() === 0 && d >= new Date(2026,9,5)) out.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}
function escalaDomingo(){
  // atendimento: Agatha, menos no 4º domingo do mês (Kátia). cozinha: Lourdes e Marcelinho alternados.
  return domingos().map((dt,i) => {
    const nDoMes = Math.ceil(dt.getDate()/7);
    return {data:dt, atendimento: nDoMes === 4 ? "Kátia" : "Agatha",
            apoio:"Luisa (extra)", cozinha: i % 2 === 0 ? "Dona Lourdes" : "Marcelinho (extra)"};
  });
}

/* ───────── render ───────── */
let aba = "ordem";
function abrir(email){
  $("gate").hidden = true; $("app").hidden = false;
  $("rodape").innerHTML = `Entrou como ${email}. Alvos do P90 das últimas 7 semanas (iFood pela API + app), mix do Menew, ` +
    `rendimento de 2,7 sandos por pão e gramagens da ficha “Revisadas 3 fatias 110 g”. ` +
    `Compromissos e caixa ficam no <a href="https://docs.google.com/spreadsheets/d/1fRwelMFzXy7YbZf5dQZv8Q7ZB8JjvHEwN6nJ-XxyecY" target="_blank" rel="noreferrer">cockpit</a>.`;
  const abas = [["ordem","Ordem do dia"],["escala","Escala"],["domingo","Domingos"]];
  $("abas").innerHTML = "";
  abas.forEach(([k,rot]) => {
    const b = document.createElement("button");
    b.textContent = rot; b.dataset.k = k; b.setAttribute("role","tab");
    b.onclick = () => { aba = k; render(); };
    $("abas").appendChild(b);
  });
  render();
}
function render(){
  [...$("abas").children].forEach(b => b.setAttribute("aria-selected", String(b.dataset.k === aba)));
  $("titulo").textContent = aba === "ordem" ? "Ordem do dia" : aba === "escala" ? "Escala da semana" : "Rodízio dos domingos";
  $("conteudo").innerHTML = aba === "ordem" ? viewOrdem() : aba === "escala" ? viewEscala() : viewDomingo();
}
let diaSel = (()=>{ const m = {2:"ter",3:"qua",4:"qui",5:"sex",6:"sáb",0:"dom"}; return m[new Date().getDay()] || "sex"; })();
function viewOrdem(){
  const d = DIA[diaSel];
  return `<nav style="position:static;margin:4px 0 0">${ORDEM.map(k =>
      `<button data-d="${k}" aria-selected="${k===diaSel}" onclick="diaSel='${k}';render()">${DIA[k].nome}</button>`).join("")}</nav>

        <span><b>sandos de alvo</b> · ${d.tag}<br>${String(d.paes).replace(".",",")} pães${d.pico?" · reserva de pico +27":""}</span></div>
      ${d.blocos.map(([h,q,t,ts]) => `<div class="bloco"><h3><span class="hora">${h}</span> ${t} <span class="quem">${q}</span></h3>
        <ul class="t">${ts.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}

        <div class="tabwrap"><table><tr><th>Sando</th><th class="num">Un</th><th class="num">Proteína</th></tr>
          ${d.itens.map(i=>`<tr><td>${i[0]}</td><td class="num">${i[1]}</td><td class="num">${i[2]}</td></tr>`).join("")}</table></div>

      </div>
    </div>`;
}

          const h = p.h[c];
          if(c === 0 && !h){
            if(p.dom4) return `<td style="text-align:center"><span class="pin ex">4º dom</span></td>`;
            if(p.domAlt !== undefined) return `<td style="text-align:center"><span class="pin ex">alternado</span></td>`;
            return `<td style="text-align:center"><span class="pin off">folga</span></td>`;
          }
          if(!h) return `<td style="text-align:center"><span class="pin off">folga</span></td>`;
          return `<td style="text-align:center;white-space:nowrap"><span class="pin ${c===0?"dom":p.extra?"ex":"on"}">${h}</span></td>`;
        }).join("")}
        <td class="num">${p.semana}h</td>
        <td style="font-size:12.5px;color:var(--tinta2)">${p.folga}</td></tr>`).join("")}
    </table></div>
    <p class="nota"><b>Jornada:</b> ninguém passa de 44h por semana, e todo turno acima de 6h tem 1h de intervalo dentro do horário acima.
    O pico de 18h às 21h fica sempre com duas pessoas no atendimento — por isso a Agatha e a Luisa entram mais cedo na sexta e no sábado.</p>
    <p class="nota"><b>A regra do rodízio:</b> ninguém trabalha mais de 5 dias e ninguém pega todos os domingos. A Agatha cobre três por mês;
    a Kátia entra no quarto, quando a Agatha folga. Na cozinha, Dona Lourdes e Marcelinho alternam, com diária extra de R$ 150
    e folga compensatória na semana.</p>
    <p class="nota">O Jean segue no contrato da Tatim, de segunda a sexta das 6h às 14h — por isso o pão nasce na manhã da terça,
    dentro da jornada que ele já tem.</p>
  </div>`;
}

function viewDomingo(){
  const linhas = escalaDomingo();
  // quem folga no domingo, pessoa por pessoa — a lei pede repouso em domingo com alguma frequência
  const PESSOAS = ["Agatha","Kátia","Luisa","Dona Lourdes","Marcelinho"];
  const trabalha = (p, l) => l.atendimento === p || l.apoio.startsWith(p) || l.cozinha.startsWith(p);
  const meses = {};
  linhas.forEach(l => {
    const m = l.data.toLocaleDateString("pt-BR",{month:"long"});
    (meses[m] = meses[m] || []).push(l);
  });
  const resumo = Object.entries(meses).map(([m, ls]) => {
    const cel = PESSOAS.map(p => {
      const folgas = ls.filter(l => !trabalha(p, l)).length;
      const ok = folgas >= 1;
      return `<td style="text-align:center"><span class="pin ${ok ? "on" : "dom"}">${folgas} de ${ls.length}</span></td>`;
    }).join("");
    return `<tr><td><b>${m}</b></td>${cel}</tr>`;
  }).join("");
  return `<div class="carta">
    <div class="tabwrap"><table>
      <tr><th>Domingo</th><th>Atendimento</th><th>Apoio</th><th>Cozinha</th></tr>
      ${linhas.map(l=>`<tr><td><b>${l.data.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</b></td>
        <td>${l.atendimento}</td><td>${l.apoio}</td><td>${l.cozinha}</td></tr>`).join("")}
    </table></div>

    <div class="bloco"><h3>Domingos de folga por pessoa <span class="quem">a lei manda</span></h3>
      <div class="tabwrap"><table>
        <tr><th>Mês</th>${PESSOAS.map(p=>`<th class="num" style="text-align:center">${p.split(" ").pop()}</th>`).join("")}</tr>
        ${resumo}
      </table></div>
      <p class="nota">Quem trabalha em domingo tem direito a repouso coincidindo com domingo de tempos em tempos — no comércio,
      ao menos <b>um domingo a cada três semanas</b>; em bar e restaurante, a frequência vem da convenção coletiva.
      Esta escala garante, no mínimo, <b>um domingo de folga por mês para cada pessoa</b>, e o rodízio é fechado de outubro a dezembro,
      para todo mundo saber com antecedência.</p>
      <p class="nota"><b>A confirmar com o jurídico (#41):</b> a frequência exata que a nossa convenção exige, e o enquadramento
      da diária de extra em sexta, sábado e domingo.</p>
    </div>

    <p class="nota"><b>Régua do dia:</b> o domingo se paga a partir de <b>R$ 1.392</b>. Média dos quatro primeiros acima de R$ 1.400 mantém;
    entre R$ 1.000 e R$ 1.400 revê o horário; abaixo disso fecha e a atendente cobre a terça.</p>
    <p class="nota">Horário proposto: <b>14h às 21h</b> — a praia esvazia entre 17h e 19h, e o pedido de domingo entra mais cedo que o de sábado.</p>
  </div>`;
}
