async function entrar(){
  const e = $("g-erro"); e.textContent = ""; $("g-btn").disabled = true;
  try{
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_KEY}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({email:$("g-mail").value.trim(),password:$("g-senha").value,returnSecureToken:true})});
    const d = await r.json();
    if(!r.ok) throw new Error(d?.error?.message || "erro");
    try{ localStorage.setItem("rs_socios", JSON.stringify({email:d.email, exp:Date.now()+12*36e5})); }catch(_){}
    abrir(d.email);
  }catch(err){
    const m = String(err.message||"");
    e.textContent = /EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN/.test(m) ? "E-mail ou senha não conferem."
                  : /TOO_MANY/.test(m) ? "Muitas tentativas. Espera um minuto." : "Não deu para entrar. Tenta de novo.";
  }finally{ $("g-btn").disabled = false; }
}
function sair(){ try{ localStorage.removeItem("rs_socios"); }catch(_){} location.reload(); }
$("g-btn").onclick = entrar;
$("g-senha").addEventListener("keydown", ev => { if(ev.key === "Enter") entrar(); });

function domingos(){                     // os domingos de outubro a dezembro
  const out = []; const d = new Date(2026,9,1);
  while(d.getFullYear() === 2026 && d.getMonth() <= 11){
    if(d.getDay() === 0 && d >= new Date(2026,9,5)) out.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}
function escalaDomingo(){
  // atendimento: Agatha, menos no 4º domingo do mês (Kátia). cozinha: Lourdes e Marcelinho alternados.
  return domingos().map((dt,i) => {

    return {data:dt, atendimento: nDoMes === 4 ? "Kátia" : "Agatha",
            apoio:"Luisa (extra)", cozinha: i % 2 === 0 ? "Dona Lourdes" : "Marcelinho (extra)"};
  });
}

    <div class="carta">
      <div class="alvo"><span class="n">${d.alvo}</span>
        <span><b>sandos de alvo</b> · ${d.tag}<br>${String(d.paes).replace(".",",")} pães${d.pico?" · reserva de pico +27":""}</span></div>
      ${d.blocos.map(([h,q,t,ts]) => `<div class="bloco"><h3><span class="hora">${h}</span> ${t} <span class="quem">${q}</span></h3>
        <ul class="t">${ts.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
      <div class="bloco"><h3>Quanto de cada coisa</h3>
        <div class="tabwrap"><table><tr><th>Sando</th><th class="num">Un</th><th class="num">Proteína</th></tr>
          ${d.itens.map(i=>`<tr><td>${i[0]}</td><td class="num">${i[1]}</td><td class="num">${i[2]}</td></tr>`).join("")}</table></div>
        <div class="tabwrap"><table><tr><th>Base</th><th class="num">Qtd</th><th>Molho</th><th class="num">Qtd</th></tr>
          ${d.base.map((x,i)=>`<tr><td>${x[0]}</td><td class="num">${x[1]}</td><td>${(d.molhos[i]||["",""])[0]}</td><td class="num">${(d.molhos[i]||["",""])[1]}</td></tr>`).join("")}</table></div>
      </div>
    </div>`;
}

      ${EQUIPE.map(p=>`<tr><td><b>${p.nome}</b><br><span style="font-size:12px;color:var(--tinta2)">${p.papel}</span></td>
        ${cols.map(c=>{

function viewDomingo(){

  linhas.forEach(l => {

  const resumo = Object.entries(meses).map(([m, ls]) => {

      <p class="nota">Quem trabalha em domingo tem direito a repouso coincidindo com domingo de tempos em tempos — no comércio,
      ao menos <b>um domingo a cada três semanas</b>; em bar e restaurante, a frequência vem da convenção coletiva.
      Esta escala garante, no mínimo, <b>um domingo de folga por mês para cada pessoa</b>, e o rodízio é fechado de outubro a dezembro,
      para todo mundo saber com antecedência.</p>
      <p class="nota"><b>A confirmar com o jurídico (#41):</b> a frequência exata que a nossa convenção exige, e o enquadramento
      da diária de extra em sexta, sábado e domingo.</p>
    </div>

    <p class="nota"><b>Régua do dia:</b> o domingo se paga a partir de <b>R$ 1.392</b>. Média dos quatro primeiros acima de R$ 1.400 mantém;
    entre R$ 1.000 e R$ 1.400 revê o horário; abaixo disso fecha e a atendente cobre a terça.</p>
    <p class="nota">Horário proposto: <b>14h às 21h</b> — a praia esvazia entre 17h e 19h, e o pedido de domingo entra mais cedo que o de sábado.</p>
  </div>`;
}


/* ───────── equipe editável + calendário com arrastar e soltar ───────── */
const PADRAO_EQUIPE = EQUIPE.map((p,i) => ({
  id:"p"+i, nome:p.nome, papel:p.papel, desde:"2026-10-01", maxSemana:44, h:p.h, extra:!!p.extra, ativo:true, obs:""
}));
function carregar(chave, padrao){
  try{ const v = JSON.parse(localStorage.getItem(chave) || "null"); return v ?? padrao; }catch(_){ return padrao; }
}
function guardar(chave, valor){ try{ localStorage.setItem(chave, JSON.stringify(valor)); }catch(_){} }
let TIME = carregar("rs_equipe", PADRAO_EQUIPE);
let PLANO = carregar("rs_escala", null) || semear();

function diasDoPeriodo(){
  const out = [], d = new Date(2026,9,1), fim = new Date(2026,11,31);
  while(d <= fim){ out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
function iso(d){ return d.toISOString().slice(0,10); }   // função, não const: é usada antes desta linha
function semear(){                       // escala inicial = o padrão de cada pessoa, de outubro a dezembro
  const plano = {};
  diasDoPeriodo().forEach(d => {
    const wd = d.getDay();
    plano[iso(d)] = TIME.filter(p => p.ativo && p.h[wd] && iso(d) >= p.desde)
      .map(p => ({id:p.id, janela:p.h[wd]}));
  });
  // domingo: Agatha nos 3 primeiros do mês, Kátia no 4º; cozinha alternando Lourdes/Marcelinho
  let n = 0;
  diasDoPeriodo().filter(d => d.getDay() === 0 && iso(d) >= "2026-10-05").forEach(d => {
    const nMes = Math.ceil(d.getDate()/7), k = iso(d);
    const atend = nMes === 4 ? "p1" : "p0", coz = n++ % 2 === 0 ? "p3" : "p4";
    plano[k] = [{id:atend, janela:"13h–21h"}, {id:"p2", janela:"14h–21h"}, {id:coz, janela:"13h–21h"}];
  });
  return plano;
}
function horas(janela){
  const m = String(janela).match(/(\d{1,2})h.*?(\d{1,2})h/);
  if(!m) return 0;
  let h = Number(m[2]) - Number(m[1]); if(h < 0) h += 24;
  return h > 6 ? h - 1 : h;              // turno acima de 6h desconta 1h de intervalo
}
function semanaDe(d){ const x = new Date(d); x.setDate(x.getDate() - ((x.getDay()+6) % 7)); return iso(x); }
function contabilidade(){
  const porSemana = {}, domFolga = {}, domTotal = {};
  diasDoPeriodo().forEach(d => {
    const k = iso(d), sem = semanaDe(d), lista = PLANO[k] || [];
    lista.forEach(it => {
      porSemana[sem] = porSemana[sem] || {};
      porSemana[sem][it.id] = (porSemana[sem][it.id] || 0) + horas(it.janela);
    });
    if(d.getDay() === 0 && k >= "2026-10-05"){
      const mes = k.slice(0,7);
      domTotal[mes] = (domTotal[mes] || 0) + 1;
      TIME.forEach(p => {
        domFolga[mes] = domFolga[mes] || {};
        if(!lista.some(it => it.id === p.id)) domFolga[mes][p.id] = (domFolga[mes][p.id] || 0) + 1;
      });
    }
  });
  return {porSemana, domFolga, domTotal};
}
let mesSel = "2026-10", escolhido = null;
function viewPlanner(){
  const {porSemana, domFolga, domTotal} = contabilidade();
  const dias = diasDoPeriodo().filter(d => iso(d).startsWith(mesSel));
  const semanas = [...new Set(dias.map(semanaDe))];
  const nome = id => (TIME.find(p => p.id === id) || {}).nome || "?";
  const chip = (it, k) => `<span class="chip" draggable="true" data-dia="${k}" data-id="${it.id}"
      title="arraste para outro dia · clique para tirar" onclick="event.stopPropagation();tirar('${k}','${it.id}')">${nome(it.id)} <b>${it.janela}</b></span>`;
  const grade = semanas.map(sem => {
    const dd = dias.filter(d => semanaDe(d) === sem);
    const linha = dd.map(d => {
      const k = iso(d), lista = PLANO[k] || [];
      return `<td class="cel ${d.getDay()===0?"domingo":""} ${escolhido?"sel":""}" data-dia="${k}" onclick="porNoDia('${k}')">
        <div class="data">${d.getDate()}/${d.getMonth()+1} <span>${NOMEDIA[d.getDay()]}</span></div>
        ${lista.map(it => chip(it,k)).join("")}</td>`;
    }).join("");
    const horasSem = Object.entries(porSemana[sem] || {})
      .map(([id,h]) => `${nome(id).split(" ").pop()} ${h}h${h > (TIME.find(p=>p.id===id)||{}).maxSemana ? " ⚠️" : ""}`).join(" · ");
    return `<tr>${linha}</tr><tr><td colspan="${dd.length}" class="resumo">${horasSem || "—"}</td></tr>`;
  }).join("");
  const alertas = TIME.filter(p => p.ativo).map(p => {
    const folgas = (domFolga[mesSel] || {})[p.id] || 0;
    return folgas === 0 ? `<li>⚠️ <b>${p.nome}</b> está sem domingo de folga em ${mesSel.slice(5)}/${mesSel.slice(2,4)} — a lei pede repouso em domingo de tempos em tempos.</li>` : "";
  }).filter(Boolean).join("");
  return `<div class="carta">
    <div class="paleta">${TIME.filter(p => p.ativo).map(p =>
      `<span class="chip fonte ${escolhido===p.id?"ativa":""}" draggable="true" data-fonte="${p.id}"
         onclick="escolhido = escolhido === '${p.id}' ? null : '${p.id}'; render()">${p.nome}</span>`).join("")}
      <span class="nota" style="margin:0 0 0 auto">no computador, arraste o nome para o dia · no celular, toque no nome e depois no dia · toque no chip do dia para tirar</span></div>
    <div class="meses">${["2026-10","2026-11","2026-12"].map(m =>
      `<button class="pin ${m===mesSel?"on":"off"}" onclick="mesSel='${m}';render()">${["outubro","novembro","dezembro"][Number(m.slice(5))-10]}</button>`).join("")}</div>
    <div class="tabwrap"><table class="cal">${grade}</table></div>
    ${alertas ? `<ul class="t" style="margin-top:14px">${alertas}</ul>` : `<p class="nota">✅ Todo mundo tem pelo menos um domingo de folga neste mês (${domTotal[mesSel]||0} domingos abertos).</p>`}
    <p class="nota">As horas por semana aparecem embaixo de cada semana, já descontando 1h de intervalo nos turnos acima de 6h.
    Mudanças ficam <b>neste aparelho</b> por enquanto — quando eu ligar o banco compartilhado, todo mundo vê a mesma escala.</p>
    <button class="botao" onclick="resetarPlano()">voltar para a escala proposta</button>
  </div>`;
}
function viewEquipe(){
  return `<div class="carta">
    <p class="nota" style="margin-top:0">Quem está disponível, a partir de quando e em que horário. O calendário usa isto como ponto de partida.</p>
    <div class="tabwrap"><table>
      <tr><th>Pessoa</th><th>Papel</th><th>Disponível a partir de</th><th class="num">Máx/semana</th><th style="text-align:center">Conta com</th></tr>
      ${TIME.map(p => `<tr>
        <td><b>${p.nome}</b></td>
        <td><input class="inp" value="${p.papel}" onchange="editarPessoa('${p.id}','papel',this.value)"></td>
        <td><input class="inp" type="date" value="${p.desde}" onchange="editarPessoa('${p.id}','desde',this.value)"></td>
        <td class="num"><input class="inp num" type="number" min="0" max="44" value="${p.maxSemana}" onchange="editarPessoa('${p.id}','maxSemana',Number(this.value))"></td>
        <td style="text-align:center"><input type="checkbox" ${p.ativo?"checked":""} onchange="editarPessoa('${p.id}','ativo',this.checked)"></td>
      </tr>`).join("")}
    </table></div>
    <p class="nota"><b>Prioridade de chamada:</b> a ordem da lista é a ordem de quem entra primeiro quando falta alguém.
    Hoje: Agatha e Kátia no atendimento, Luisa como extra, Lourdes e Marcelinho na cozinha, Jean só na manhã (contrato Tatim).</p>
    <button class="botao" onclick="novaPessoa()">+ pessoa</button>
  </div>`;
}
function editarPessoa(id, campo, valor){
  const p = TIME.find(x => x.id === id); if(!p) return;
  p[campo] = valor; guardar("rs_equipe", TIME); render();
}
function novaPessoa(){
  TIME.push({id:"p"+Date.now(), nome:"Nova pessoa", papel:"a definir", desde:iso(new Date()), maxSemana:44, h:{}, ativo:true});
  guardar("rs_equipe", TIME); render();
}
function porNoDia(dia){
  if(!escolhido) return;
  const p = TIME.find(x => x.id === escolhido); if(!p) return;
  const wd = new Date(dia + "T12:00").getDay();
  const janela = p.h[wd] || p.h[5] || "16h–22h";
  PLANO[dia] = (PLANO[dia] || []).filter(it => it.id !== p.id).concat([{id:p.id, janela}]);
  guardar("rs_escala", PLANO); render();
}
function tirar(dia, id){
  PLANO[dia] = (PLANO[dia] || []).filter(it => it.id !== id);
  guardar("rs_escala", PLANO); render();
}
function resetarPlano(){ PLANO = semear(); guardar("rs_escala", PLANO); render(); }
function ligarDnD(){
  let arrastando = null;
  document.querySelectorAll(".chip[draggable]").forEach(c => {
    c.addEventListener("dragstart", e => {
      arrastando = {id: c.dataset.id || c.dataset.fonte, de: c.dataset.dia || null};
      e.dataTransfer.effectAllowed = "move";
    });
  });
  document.querySelectorAll(".cel").forEach(cel => {
    cel.addEventListener("dragover", e => { e.preventDefault(); cel.classList.add("alvo"); });
    cel.addEventListener("dragleave", () => cel.classList.remove("alvo"));
    cel.addEventListener("drop", e => {
      e.preventDefault(); cel.classList.remove("alvo");
      if(!arrastando) return;
      const dia = cel.dataset.dia, p = TIME.find(x => x.id === arrastando.id);
      if(!p) return;
      if(arrastando.de) PLANO[arrastando.de] = (PLANO[arrastando.de] || []).filter(it => it.id !== p.id);
      const wd = new Date(dia + "T12:00").getDay();
      const janela = p.h[wd] || p.h[5] || "16h–22h";
      PLANO[dia] = (PLANO[dia] || []).filter(it => it.id !== p.id).concat([{id:p.id, janela}]);
      guardar("rs_escala", PLANO); arrastando = null; render();
    });
  });
}
