<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rio Sandô — cozinha</title>
<style>
  :root{--preto:#1A1A1A;--creme:#F5F0EB;--vermelho:#C0392B;--verde:#2D5A27;--card:#FDFBF8;--linha:rgba(26,26,26,.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Futura,'Century Gothic',sans-serif;background:var(--preto);color:var(--creme);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  h1{font-size:20px;letter-spacing:.15em}
  h1 span{color:var(--vermelho)}
  .sub{font-size:12px;opacity:.6;letter-spacing:.1em}
  button{font-family:inherit;cursor:pointer}
  .sair{background:none;border:1px solid var(--creme);color:var(--creme);border-radius:99px;padding:7px 16px;font-size:12px}

  /* login */
  .login{max-width:360px;margin:14vh auto 0;background:var(--card);color:var(--preto);border-radius:16px;padding:28px}
  .login h2{font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--vermelho);margin-bottom:18px}
  .login label{display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin:14px 0 6px;opacity:.7}
  .login input{width:100%;font-family:inherit;font-size:15px;padding:12px;border:1px solid var(--preto);border-radius:10px;background:#fff}
  .login button{width:100%;margin-top:20px;background:var(--vermelho);color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;letter-spacing:.08em}
  .login .erro{color:var(--vermelho);font-size:12px;margin-top:10px;min-height:16px}

  /* board */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .col h2{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:10px;opacity:.8}
  .pedido{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:12px;position:relative}
  .pedido.novo-flash{outline:3px solid var(--vermelho)}
  .ped-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .codigo{font-size:18px;font-weight:500}
  .hora{font-size:12px;opacity:.55}
  .cliente{font-size:13px;margin-bottom:8px}
  .cliente a{color:var(--verde);text-decoration:none}
  .itens{border-top:1px dashed var(--linha);padding-top:8px;font-size:14px;line-height:1.7}
  .itens b{color:var(--vermelho)}
  .meta{font-size:12px;opacity:.7;margin-top:8px;line-height:1.5}
  .total{font-size:15px;font-weight:500;margin-top:8px}
  .acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .avancar{flex:1;background:var(--preto);color:var(--creme);border:none;border-radius:10px;padding:11px;font-size:13px;letter-spacing:.05em}
  .imprimir,.cancelar{background:none;border:1px solid var(--preto);border-radius:10px;padding:11px 13px;font-size:13px}
  .cancelar{border-color:var(--vermelho);color:var(--vermelho)}
  .vazio{opacity:.4;font-size:13px;padding:14px 4px}
  .badge{position:absolute;top:-8px;right:12px;background:var(--vermelho);color:#fff;font-size:10px;letter-spacing:.1em;padding:3px 10px;border-radius:99px}
  .topbtn{background:none;border:1px solid var(--creme);color:var(--creme);border-radius:99px;padding:7px 16px;font-size:12px;margin-left:8px}
  .afcard{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:12px}
  .afcard h3{font-size:17px}
  .afcard .linha{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:6px;opacity:.8}
  .afcard .repasse{font-size:20px;font-weight:500;margin-top:10px}
  .afcard .repasse b{color:var(--vermelho)}
  .afform{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:16px}
  .afform label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin:10px 0 4px}
  .afform input{width:100%;font-family:inherit;font-size:15px;padding:10px;border:1px solid var(--preto);border-radius:8px;background:#fff}
  .afform .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .afform button{width:100%;margin-top:14px;background:var(--vermelho);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px}
  .pagarcom{background:var(--verde);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px}
  .off{background:var(--preto);color:var(--creme);border:none;border-radius:8px;padding:5px 10px;font-size:11px}
  /* cotação de entrega */
  .enviar-btn{width:100%;background:var(--verde);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:500;letter-spacing:.03em;margin-top:8px}
  .cot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .cotcard{background:var(--card);color:var(--preto);border:2px solid var(--linha);border-radius:12px;padding:12px;position:relative;text-align:left}
  .cotcard.melhor{border-color:var(--verde)}
  .cotcard .prov{font-size:14px;font-weight:600}
  .cotcard .preco{font-size:22px;font-weight:600;margin:4px 0 2px}
  .cotcard .det{font-size:11px;opacity:.65;line-height:1.4;min-height:28px}
  .cotcard .selo{position:absolute;top:-9px;right:8px;background:var(--verde);color:#fff;font-size:9px;letter-spacing:.06em;padding:2px 8px;border-radius:99px}
  .cotcard .chamar{width:100%;margin-top:8px;background:var(--preto);color:var(--creme);border:none;border-radius:8px;padding:9px;font-size:12.5px;font-weight:500}
  .cotcard.melhor .chamar{background:var(--verde)}
  .cot-off{background:var(--card);color:var(--preto);border:1px dashed var(--linha);border-radius:12px;padding:12px;opacity:.6;font-size:11.5px}
  .cot-ifood{display:block;text-align:center;background:#EA1D2C;color:#fff;border-radius:10px;padding:11px;font-size:13px;text-decoration:none;margin-top:8px;font-weight:500}
  @media print{
    body *{display:none}
    #comanda,#comanda *{display:block}
    #comanda{position:absolute;top:0;left:0;width:80mm;color:#000;background:#fff;
      font-family:monospace;font-size:12px;padding:4mm;line-height:1.5;white-space:pre-wrap}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="comanda"></div>
<script>
const RIO_API = "https://rio-api-517724804994.southamerica-east1.run.app";
const PGREST  = "https://postgrest-517724804994.southamerica-east1.run.app";
const FB_KEY  = "AIzaSyChnmo3XFjrFodlnnRq_ZOc2NYqdMgZKDQ";
const NEXT = {novo:["em_preparo","▶ Iniciar preparo"], em_preparo:["pronto","✔ Pronto"], pronto:["entregue","✅ Entregue / retirado"], saiu:["entregue","✅ Entregue"]};
const COLS = [["novo","🔴 Novos"],["em_preparo","🔪 Em preparo"],["pronto","📦 Prontos"],["saiu","🛵 Saiu"]];
let sess = JSON.parse(localStorage.getItem("rs_sess")||"null");
let view = "board";
let pedidos = [], vistos = new Set(JSON.parse(localStorage.getItem("rs_vistos")||"[]")), timer=null;
let impressos = new Set(JSON.parse(localStorage.getItem("rs_impressos")||"[]"));
const fmt = v => "R$ " + Number(v).toFixed(2).replace(".",",").replace(",00","");
const $ = id => document.getElementById(id);
// todo dado digitado pelo cliente passa por aqui antes de virar HTML (anti-XSS)
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlSegura = u => typeof u==="string" && /^https:\/\/[\w.-]+\//.test(u) ? esc(u) : null;

function render(){
  const app=$("app");
  if(!sess){
    app.innerHTML=`<div class="login">
      <h2>Rio Sandô · Cozinha</h2>
      <label>E-mail</label><input id="email" type="email" value="riosandolito@gmail.com">
      <label>Senha</label><input id="senha" type="password">
      <button onclick="entrar()">Entrar</button><div class="erro" id="lerro"></div></div>`;
    return;
  }
  if(view==="afiliados"){ renderAfiliados(); return; }
  if(view==="historico"){ renderHistorico(); return; }
  if(view==="manual"){ renderManual(); return; }
  if(view==="envio"){ renderEnvioAvulso(); return; }
  app.innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · COZINHA</h1><div class="sub">pedidos de hoje · atualiza sozinho</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end">
        <button class="topbtn" onclick="abrirPedidoManual()">➕ Pedido</button>
        <button class="topbtn" onclick="abrirEnvioAvulso()">🛵 Envio</button>
        <button class="topbtn" onclick="abrirHistorico()">📋 Histórico</button>
        <button class="topbtn" onclick="abrirAfiliados()">🤝 Afiliados</button>
        <button class="sair" onclick="sair()">Sair</button></div>
    </header>
    <div class="cols">${COLS.map(([st,titulo])=>{
      const list=pedidos.filter(p=>p.status===st);
      return `<div class="col"><h2>${titulo} (${list.length})</h2>
        ${!list.length?`<div class="vazio">nada por aqui</div>`:list.map(card).join("")}</div>`;
    }).join("")}</div>`;
}
let afiliados=[], comissoes=[], candidaturas=[], codigosUsados=new Set(), aprovandoCand=null;
// link da lojinha do afiliado (troca aqui quando o subdomínio bonito entrar)
const linkAfiliado = cod => `https://riosando.coletivo.app/${String(cod).toLowerCase()}`;
const igLink = ig => { ig=(ig||"").trim(); if(!ig) return ""; if(/^https?:/i.test(ig)) return ig; return "https://instagram.com/"+ig.replace(/^@/,""); };
function abrirAfiliados(){ view="afiliados"; render(); carregarAfiliados(); }
function voltarBoard(){ view="board"; render(); }
// ── Histórico de pedidos (restaurante vê tudo) ──
let historico=[];
function abrirHistorico(){ view="historico"; render(); carregarHist(); }
async function carregarHist(){
  const r=await api("pedidos?select=codigo,nome,bairro,modo,total,status,pagamento,pagamento_status,itens,created_at&order=created_at.desc&limit=150");
  if(r&&r.ok) historico=await r.json();
  if(view==="historico") filtrarHist();
}
const ROTH={novo:"recebido",em_preparo:"em preparo",pronto:"pronto",saiu:"saiu 🛵",entregue:"entregue ✅",cancelado:"cancelado ✕"};
function histCard(p){
  return `<div class="afcard">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h3>#${esc(p.codigo)}</h3><span style="font-size:12px;opacity:.6">${new Date(p.created_at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>
    <div class="linha"><span>${esc(p.nome)} · ${p.modo==="entrega"?"🛵 "+esc(p.bairro||"entrega"):"🏠 retirada"}</span><b>${fmt(p.total)}</b></div>
    <div class="linha" style="opacity:.8">${(p.itens||[]).map(i=>`${Number(i.qtd)||"?"}× ${esc(i.item)}`).join(", ")}</div>
    <div class="linha"><span style="opacity:.7">${ROTH[p.status]||esc(p.status)} · ${p.pagamento_status==="pago"?"pago online":"pgto "+esc(p.pagamento)}</span></div>
  </div>`;
}
function filtrarHist(){
  const q=($("hist-busca")?.value||"").toLowerCase().trim();
  const list=historico.filter(p=>!q || p.codigo.toLowerCase().includes(q) || (p.nome||"").toLowerCase().includes(q));
  const el=$("hist-lista"); if(el) el.innerHTML = list.length? list.map(histCard).join("") : `<div class="vazio">nenhum pedido encontrado</div>`;
}
function renderHistorico(){
  $("app").innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · HISTÓRICO</h1><div class="sub">${historico.length} pedidos · mais recentes primeiro</div></div>
      <div><button class="topbtn" onclick="voltarBoard()">← Pedidos</button><button class="sair" onclick="sair()">Sair</button></div>
    </header>
    <input class="login" style="margin:0 0 16px;max-width:none;padding:12px 14px;border:1px solid var(--creme);background:var(--card);color:var(--preto);border-radius:10px;width:100%;font-family:inherit;font-size:15px" id="hist-busca" placeholder="🔎 buscar por código ou nome" oninput="filtrarHist()">
    <div id="hist-lista"></div>`;
  filtrarHist();
}
// ── Envio avulso (só a entrega, sem pedido de comida — coleta na cozinha) ──
let eF={destino:"",nome:"",zap:"",obs:""};
function abrirEnvioAvulso(){ view="envio"; eF={destino:"",nome:"",zap:"",obs:""}; render(); }
function renderEnvioAvulso(){
  $("app").innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · ENVIO AVULSO</h1><div class="sub">chamar motoboy só pra levar algo (coleta aqui na cozinha)</div></div>
      <div><button class="topbtn" onclick="voltarBoard()">← Pedidos</button><button class="sair" onclick="sair()">Sair</button></div>
    </header>
    <div class="afform">
      <label>Endereço de entrega</label><input id="e-dest" value="${esc(eF.destino)}" oninput="eF.destino=this.value" placeholder="Rua, número, bairro, complemento">
      <label>Quem recebe</label><input id="e-nome" value="${esc(eF.nome)}" oninput="eF.nome=this.value" placeholder="Nome do destinatário">
      <label>WhatsApp de quem recebe (opcional)</label><input id="e-zap" type="tel" value="${esc(eF.zap)}" oninput="eF.zap=this.value" placeholder="21 9 9999-9999">
      <label>Observações (opcional)</label><input id="e-obs" value="${esc(eF.obs)}" oninput="eF.obs=this.value" placeholder="Ex: entregar na portaria, apto 302">
      <div class="mp-note" id="e-erro" style="color:var(--vermelho);font-size:12px;min-height:14px;margin-top:8px"></div>
      <button class="enviar-btn" onclick="cotarEnvio(this)">🔎 Cotar entregadores</button>
      <div id="e-cotacao" style="margin-top:10px"></div>
    </div>`;
}
async function cotarEnvio(btn){
  if(!eF.destino.trim()){ $("e-erro").textContent="Coloca o endereço de entrega."; return; }
  if(!eF.nome.trim()){ $("e-erro").textContent="Quem vai receber?"; return; }
  $("e-erro").textContent="";
  const el=$("e-cotacao"); el.innerHTML=`<div style="text-align:center;opacity:.65;font-size:12px;margin:10px 0">🔎 cotando...</div>`;
  try{
    if(Date.now()>sess.exp && !(await renovar())) return;
    const r=await fetch(`${RIO_API}/entrega-cotar`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${sess.token}`},body:JSON.stringify({endereco:eF.destino})});
    const d=await r.json();
    const nomeP=p=>p==="lalamove"?"Lalamove":p==="uber_direct"?"Uber":p;
    const disp=d.cotacoes.filter(c=>c.disponivel);
    const maisBarato=[...disp].sort((a,b)=>(a.preco??1e9)-(b.preco??1e9))[0]?.provedor;
    const cards=d.cotacoes.map(c=>{
      if(!c.disponivel) return `<div class="cot-off">✕ ${nomeP(c.provedor)}<br>${esc(c.motivo||"")}</div>`;
      const det=[c.veiculo,c.coleta_min?`busca ~${c.coleta_min}min`:"",c.eta?`entrega ~${c.eta}`:"",c.distancia?`${c.distancia} km`:""].filter(Boolean).join(" · ");
      return `<div class="cotcard ${c.provedor===maisBarato?"melhor":""}">${c.provedor===maisBarato?'<span class="selo">💚 MAIS BARATO</span>':""}
        <div class="prov">${nomeP(c.provedor)}</div><div class="preco">R$ ${(c.preco??0).toFixed(2)}</div>
        <div class="det">${det||"&nbsp;"}</div>
        <button class="chamar" onclick='chamarEnvio("${c.provedor}","${c.quote_id}",this)'>Chamar ✓</button></div>`;
    }).join("");
    el.innerHTML=`<div class="cot-grid">${cards}</div>${disp.length?"":`<a class="cot-ifood" href="https://portal.ifood.com.br" target="_blank">🔴 pedir pelo iFood</a>`}`;
  }catch(e){ el.innerHTML=`<div style="font-size:12px;opacity:.8">erro ao cotar</div>`; }
}
async function chamarEnvio(provedor, quoteId, btn){
  const nome=provedor==="lalamove"?"Lalamove":"Uber";
  if(!confirm(`Chama um motoboy DE VERDADE (${nome}) pra buscar aqui e levar? Cobra na conta.`)) return;
  btn.disabled=true; btn.textContent="Chamando...";
  try{
    if(Date.now()>sess.exp && !(await renovar())) return;
    const r=await fetch(`${RIO_API}/entrega-avulsa`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${sess.token}`},body:JSON.stringify({destino:eF.destino,nome:eF.nome,whatsapp:eF.zap,obs:eF.obs,provedor,quote_id:quoteId})});
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.detalhe?`${d.erro}: ${String(d.detalhe).slice(0,100)}`:d.erro);
    $("e-cotacao").innerHTML=`<div class="afcard" style="text-align:center"><h3>✅ Motoboy chamado!</h3>
      <p style="opacity:.75;font-size:13px;margin:8px 0">${nome} · envio ${esc(d.codigo||"")}${d.preco?` · R$ ${Number(d.preco).toFixed(2)}`:""}</p>
      ${d.tracking_url?`<a class="pagarcom" style="display:block;text-decoration:none;padding:12px" href="${esc(d.tracking_url)}" target="_blank">rastrear no mapa 🗺️</a>`:""}
      <button class="off" style="width:100%;margin-top:8px" onclick="abrirEnvioAvulso()">+ novo envio</button></div>`;
  }catch(e){ btn.disabled=false; btn.textContent="tentar de novo"; $("e-erro").textContent="Falhou: "+e.message; }
}
// ── Pedido manual (equipe monta + gera Pix pro WhatsApp) ──
let mProdutos=[], mFretes={}, mCart={}, mModo="retirada", mResultado=null;
let mF={nome:"",zap:"",end:"",obs:"",bairro:""};
function abrirPedidoManual(){ view="manual"; mCart={}; mResultado=null; mModo="retirada"; mF={nome:"",zap:"",end:"",obs:"",bairro:""}; render(); carregarCatalogoManual(); }
async function carregarCatalogoManual(){
  const [rp,rf]=await Promise.all([api("produtos?ativo=eq.true&select=id,nome,preco&order=nome"), api("fretes?select=bairro,valor&order=bairro")]);
  if(rp&&rp.ok) mProdutos=await rp.json();
  if(rf&&rf.ok){ const f=await rf.json(); mFretes={}; f.forEach(x=>mFretes[x.bairro]=Number(x.valor)); }
  if(view==="manual") renderManual();
}
const mById = id => mProdutos.find(p=>p.id===id);
function mMudar(id,d){ mCart[id]=(mCart[id]||0)+d; if(mCart[id]<=0) delete mCart[id]; renderManual(); }
function mComida(){ let t=0; for(const id in mCart){ const p=mById(id); if(p) t+=mCart[id]*Number(p.preco); } return t; }
function mFrete(){ return mModo==="entrega" && mF.bairro && mFretes[mF.bairro]!=null ? mFretes[mF.bairro] : 0; }
function mSetModo(v){ mModo=v; renderManual(); }
function renderManual(){
  if(mResultado){ renderManualPix(); return; }
  const comida=mComida(), frete=mFrete(), total=comida+frete;
  $("app").innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · PEDIDO MANUAL</h1><div class="sub">monta o pedido e gera o Pix pro cliente</div></div>
      <div><button class="topbtn" onclick="voltarBoard()">← Pedidos</button><button class="sair" onclick="sair()">Sair</button></div>
    </header>
    <div class="afform">
      <h3 style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--vermelho)">Itens</h3>
      <div style="max-height:240px;overflow:auto;margin:8px 0;border:1px solid var(--linha);border-radius:10px">
        ${mProdutos.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--linha)">
          <span style="font-size:13px">${esc(p.nome)} <span style="opacity:.55">· ${fmt(p.preco)}</span></span>
          <span style="display:flex;align-items:center;gap:8px">${mCart[p.id]?`<button class="off" onclick="mMudar('${p.id}',-1)">−</button><b>${mCart[p.id]}</b>`:""}<button class="off" onclick="mMudar('${p.id}',1)">+</button></span>
        </div>`).join("")}
      </div>
      <div style="text-align:right;font-size:15px;margin-bottom:4px">${Object.keys(mCart).length?`Comida ${fmt(comida)}${frete?` + entrega ${fmt(frete)}`:""} = <b>${fmt(total)}</b>`:"<span style='opacity:.5'>escolhe os itens acima</span>"}</div>
      <label>Nome do cliente</label><input id="m-nome" value="${esc(mF.nome)}" oninput="mF.nome=this.value" placeholder="Nome">
      <label>WhatsApp do cliente</label><input id="m-zap" type="tel" value="${esc(mF.zap)}" oninput="mF.zap=this.value" placeholder="21 9 9999-9999">
      <label>Entrega ou retirada</label>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button type="button" class="off" style="flex:1${mModo==="retirada"?";background:var(--vermelho);color:#fff":""}" onclick="mSetModo('retirada')">🏠 Retirada</button>
        <button type="button" class="off" style="flex:1${mModo==="entrega"?";background:var(--vermelho);color:#fff":""}" onclick="mSetModo('entrega')">🛵 Entrega</button>
      </div>

// monta código NOME+% a partir do @ (preferido) ou nome, resolvendo colisão
function montarCodigo(base, desc){
  base=(base||"").replace(/^@/,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase().slice(0,14);
  if(!base) return "";
  const n=Math.round(Number(desc)||0);
  let cod=base+n;
  if(!codigosUsados.has(cod)) return cod;
  for(let i=2;i<=9;i++){ if(!codigosUsados.has(base+i+n)) return base+i+n; } // GABRIEL10 → GABRIEL210
  return cod;
}

  const base = ig ? ig.replace(/^@/,"").replace(/.*instagram\.com\//,"") : nome.split(" ")[0];
  const c=montarCodigo(base, desc);
  if(c) $("af-cod").value=c;
}

async function _ponte(idToken){
  const r = await fetch(`${RIO_API}/auth/token`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({firebase_token:idToken})});
  return r.ok ? await r.json() : null;
}
async function entrar(){
  const fr = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_KEY}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:$("email").value.trim(),password:$("senha").value,returnSecureToken:true})});
  const fd = await fr.json();
  if(!fr.ok){ $("lerro").textContent="Login falhou — confere a senha?"; return; }
  const br = await _ponte(fd.idToken);
  if(!br||!br.token){ $("lerro").textContent="Falha ao conectar — tenta de novo."; return; }
  sess={token:br.token, refresh:fd.refreshToken, exp:Date.now()+(Number(fd.expiresIn)-60)*1000};
  localStorage.setItem("rs_sess",JSON.stringify(sess));
  iniciar();
}
async function renovar(){
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_KEY}`,{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({grant_type:"refresh_token",refresh_token:sess.refresh})});
  const d = await r.json();
  if(!r.ok){ sair(); return false; }
  const br = await _ponte(d.id_token);
  if(!br||!br.token){ sair(); return false; }
  sess={token:br.token, refresh:d.refresh_token, exp:Date.now()+(Number(d.expires_in)-60)*1000};
  localStorage.setItem("rs_sess",JSON.stringify(sess));
  return true;
}
async function api(path, opts={}){
  if(Date.now()>sess.exp && !(await renovar())) return null;
  return fetch(`${PGREST}/${path}`,{...opts,
    headers:{Authorization:`Bearer ${sess.token}`,
      "Content-Type":"application/json", ...(opts.headers||{})}});
}
async function carregar(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const r = await api(`pedidos?created_at=gte.${hoje.toISOString()}&status=not.in.(entregue,cancelado)&pagamento_status=not.in.(pendente,falhou,estornado)&order=created_at.asc`);
  if(!r || !r.ok) return;
  const dados = await r.json();
  const novos = dados.filter(p=>p.status==="novo" && !vistos.has(p.id));
  if(novos.length && pedidos.length !== undefined && document.hasFocus()!==null){
    if(carregar.ja) bip();
  }
  const autoprint = new URLSearchParams(location.search).has("autoprint");
  const paraImprimir = carregar.ja && autoprint ? novos.filter(p=>!impressos.has(p.id)) : [];
  carregar.ja = true;
  pedidos = dados;
  if(view==="board") render();
  // modo quiosque (?autoprint=1 + Chrome --kiosk-printing): comanda sai sozinha na térmica
  for(const p of paraImprimir){
    impressos.add(p.id);
    localStorage.setItem("rs_impressos", JSON.stringify([...impressos].slice(-200)));
    imprimir(p.id);
    await new Promise(r=>setTimeout(r,1500));
  }
  setTimeout(()=>{ dados.forEach(p=>vistos.add(p.id));
    localStorage.setItem("rs_vistos",JSON.stringify([...vistos].slice(-200))); }, 8000);
}

      <a class="cot-ifood" href="https://portal.ifood.com.br" target="_blank">🔴 ou pedir entregador pelo iFood</a>
      ${algum?"":`<div style="margin-top:6px;font-size:12px;opacity:.7">Nenhum app cotou — usa o iFood acima 👆</div>`}`;
  }catch(e){ el.innerHTML = `<div style="font-size:12px;opacity:.8;margin-top:8px">erro ao cotar. <a class="cot-ifood" href="https://portal.ifood.com.br" target="_blank">🔴 pedir entregador pelo iFood</a></div>`; }
}
async function chamarEntrega(id, provedor, quoteId, btn){
  const nome = provedor==="lalamove"?"Lalamove":provedor==="uber_direct"?"Uber":provedor;
  if(!confirm(`Isso chama um motoboy DE VERDADE (${nome}) e cobra na conta. Confirma?`)) return;
  btn.disabled = true; btn.textContent = "Chamando...";
  const el = document.getElementById(`cotacao-${id}`);
  try{
    if(Date.now()>sess.exp && !(await renovar())) return;
    const r = await fetch(`${RIO_API}/entrega-criar`,{
      method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${sess.token}`},
      body:JSON.stringify({pedido_id:id, provedor, quote_id:quoteId})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detalhe ? `${d.erro}: ${String(d.detalhe).slice(0,120)}` : d.erro);
    el.innerHTML = `✅ Entregador chamado (${provedor})${d.tracking_url?` · <a href="${d.tracking_url}" target="_blank" style="color:var(--verde)">rastrear 🗺️</a>`:""}`;
    carregar();
  }catch(e){
    btn.disabled=false; btn.textContent="tentar de novo";
    el.innerHTML += `<br>⚠️ falhou: ${e.message} — cota de novo ou usa o Entrega Fácil`;
  }
}
async function cancelarEntrega(id, btn){
  if(!confirm("Cancelar a corrida com o entregador? Faça isso só antes do motoboy retirar.")) return;
  btn.disabled = true; btn.textContent = "Cancelando...";
  try{
    if(Date.now()>sess.exp && !(await renovar())) return;
    const r = await fetch(`${RIO_API}/entrega-cancelar`,{
      method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${sess.token}`},
      body:JSON.stringify({pedido_id:id})});
    const d = await r.json();
    if(!r.ok || !d.ok) throw new Error(d.erro || "não deu");
    carregar();
  }catch(e){
    btn.disabled=false; btn.textContent="✕ cancelar entrega";
    alert("Não cancelou: "+e.message+"\nSe o motoboy já retirou, cancele direto no app do provedor.");
  }
}
function bip(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.3,.6].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.setValueAtTime(.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.25);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.3);
    });
  }catch(e){}
}
function iniciar(){ render(); carregar(); clearInterval(timer); timer=setInterval(carregar,10000); }
function sair(){ sess=null; localStorage.removeItem("rs_sess"); clearInterval(timer); render(); }
sess ? iniciar() : render();
</script>
