<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rio Sandô — cozinha</title>
<style>
  :root{--preto:#1A1A1A;--creme:#F5F0EB;--vermelho:#C0392B;--verde:#2D5A27;--card:#FDFBF8;--linha:rgba(26,26,26,.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Futura,'Century Gothic',sans-serif;background:var(--preto);color:var(--creme);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  h1{font-size:20px;letter-spacing:.15em}
  h1 span{color:var(--vermelho)}
  .sub{font-size:12px;opacity:.6;letter-spacing:.1em}
  button{font-family:inherit;cursor:pointer}
  .sair{background:none;border:1px solid var(--creme);color:var(--creme);border-radius:99px;padding:7px 16px;font-size:12px}

  /* login */
  .login{max-width:360px;margin:14vh auto 0;background:var(--card);color:var(--preto);border-radius:16px;padding:28px}
  .login h2{font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--vermelho);margin-bottom:18px}
  .login label{display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin:14px 0 6px;opacity:.7}
  .login input{width:100%;font-family:inherit;font-size:15px;padding:12px;border:1px solid var(--preto);border-radius:10px;background:#fff}
  .login button{width:100%;margin-top:20px;background:var(--vermelho);color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;letter-spacing:.08em}
  .login .erro{color:var(--vermelho);font-size:12px;margin-top:10px;min-height:16px}

  /* board */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .col h2{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:10px;opacity:.8}
  .pedido{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:12px;position:relative}
  .pedido.novo-flash{outline:3px solid var(--vermelho)}
  .ped-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .codigo{font-size:18px;font-weight:500}
  .hora{font-size:12px;opacity:.55}
  .cliente{font-size:13px;margin-bottom:8px}
  .cliente a{color:var(--verde);text-decoration:none}
  .itens{border-top:1px dashed var(--linha);padding-top:8px;font-size:14px;line-height:1.7}
  .itens b{color:var(--vermelho)}
  .meta{font-size:12px;opacity:.7;margin-top:8px;line-height:1.5}
  .total{font-size:15px;font-weight:500;margin-top:8px}
  .acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .avancar{flex:1;background:var(--preto);color:var(--creme);border:none;border-radius:10px;padding:11px;font-size:13px;letter-spacing:.05em}
  .imprimir,.cancelar{background:none;border:1px solid var(--preto);border-radius:10px;padding:11px 13px;font-size:13px}
  .cancelar{border-color:var(--vermelho);color:var(--vermelho)}
  .vazio{opacity:.4;font-size:13px;padding:14px 4px}
  .badge{position:absolute;top:-8px;right:12px;background:var(--vermelho);color:#fff;font-size:10px;letter-spacing:.1em;padding:3px 10px;border-radius:99px}
  .topbtn{background:none;border:1px solid var(--creme);color:var(--creme);border-radius:99px;padding:7px 16px;font-size:12px;margin-left:8px}
  .afcard{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:12px}
  .afcard h3{font-size:17px}
  .afcard .linha{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:6px;opacity:.8}
  .afcard .repasse{font-size:20px;font-weight:500;margin-top:10px}
  .afcard .repasse b{color:var(--vermelho)}
  .afform{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:16px}
  .afform label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin:10px 0 4px}
  .afform input{width:100%;font-family:inherit;font-size:15px;padding:10px;border:1px solid var(--preto);border-radius:8px;background:#fff}
  .afform .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .afform button{width:100%;margin-top:14px;background:var(--vermelho);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px}
  .pagarcom{background:var(--verde);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px}
  .off{background:var(--preto);color:var(--creme);border:none;border-radius:8px;padding:5px 10px;font-size:11px}
  @media print{
    body *{display:none}
    #comanda,#comanda *{display:block}
    #comanda{position:absolute;top:0;left:0;width:80mm;color:#000;background:#fff;
      font-family:monospace;font-size:12px;padding:4mm;line-height:1.5;white-space:pre-wrap}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="comanda"></div>
<script>
const SUPA_URL = "https://xngsucsxqbmvdnyuabll.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuZ3N1Y3N4cWJtdmRueXVhYmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDg1MTYsImV4cCI6MjEwMjcyNDUxNn0.P5vuyAyooZ_BArc_lC7HiQ2N-p0Fi7ejpxzyehPSi1Q";
const NEXT = {novo:["em_preparo","▶ Iniciar preparo"], em_preparo:["pronto","✔ Pronto"], pronto:["entregue","🛵 Saiu / entregue"]};
const COLS = [["novo","🔴 Novos"],["em_preparo","🔪 Em preparo"],["pronto","📦 Prontos"]];
let sess = JSON.parse(localStorage.getItem("rs_sess")||"null");
let view = "board";
let pedidos = [], vistos = new Set(JSON.parse(localStorage.getItem("rs_vistos")||"[]")), timer=null;
let impressos = new Set(JSON.parse(localStorage.getItem("rs_impressos")||"[]"));
const fmt = v => "R$ " + Number(v).toFixed(2).replace(".",",").replace(",00","");
const $ = id => document.getElementById(id);
// todo dado digitado pelo cliente passa por aqui antes de virar HTML (anti-XSS)
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlSegura = u => typeof u==="string" && /^https:\/\/[\w.-]+\//.test(u) ? esc(u) : null;

function render(){
  const app=$("app");
  if(!sess){
    app.innerHTML=`<div class="login">
      <h2>Rio Sandô · Cozinha</h2>
      <label>E-mail</label><input id="email" type="email" value="riosandolito@gmail.com">
      <label>Senha</label><input id="senha" type="password">
      <button onclick="entrar()">Entrar</button><div class="erro" id="lerro"></div></div>`;
    return;
  }
  if(view==="afiliados"){ renderAfiliados(); return; }
  app.innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · COZINHA</h1><div class="sub">pedidos de hoje · atualiza sozinho</div></div>
      <div><button class="topbtn" onclick="abrirAfiliados()">🤝 Afiliados</button><button class="sair" onclick="sair()">Sair</button></div>
    </header>
    <div class="cols">${COLS.map(([st,titulo])=>{
      const list=pedidos.filter(p=>p.status===st);
      return `<div class="col"><h2>${titulo} (${list.length})</h2>
        ${!list.length?`<div class="vazio">nada por aqui</div>`:list.map(card).join("")}</div>`;
    }).join("")}</div>`;
}
let afiliados=[], comissoes=[];
function abrirAfiliados(){ view="afiliados"; render(); carregarAfiliados(); }
function voltarBoard(){ view="board"; render(); }
async function carregarAfiliados(){
  const [ra,rc]=await Promise.all([
    api("afiliados?tipo=eq.influencer&select=id,codigo,nome,desconto_pct,comissao_pct,ativo&order=created_at.desc"),
    api("comissoes?status=eq.confirmada&select=afiliado_id,valor")
  ]);
  if(ra&&ra.ok) afiliados=await ra.json();
  if(rc&&rc.ok) comissoes=await rc.json();
  if(view==="afiliados") renderAfiliados();
}
function renderAfiliados(){
  const pend={}; comissoes.forEach(c=>pend[c.afiliado_id]=(pend[c.afiliado_id]||0)+Number(c.valor));
  $("app").innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · AFILIADOS</h1><div class="sub">códigos de influencer, desconto e repasse</div></div>
      <div><button class="topbtn" onclick="voltarBoard()">← Pedidos</button><button class="sair" onclick="sair()">Sair</button></div>
    </header>
    <div class="afform">
      <h3 style="font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--vermelho)">+ Novo afiliado</h3>
      <label>Nome (quem divulga)</label><input id="af-nome" placeholder="Ex: Gabriel do Insta">
      <label>Código (o que o cliente digita)</label><input id="af-cod" placeholder="GABRIEL" style="text-transform:uppercase">
      <div class="grid">
        <div><label>Desconto do cliente %</label><input id="af-desc" type="number" value="10" min="0" max="50"></div>
        <div><label>Comissão do afiliado %</label><input id="af-com" type="number" value="0" min="0" max="30"></div>
      </div>
      <div class="mp-note" id="af-erro" style="color:var(--vermelho);font-size:12px;min-height:14px;margin-top:8px"></div>
      <button onclick="criarAfiliado(this)">Criar código</button>
    </div>
    ${!afiliados.length?`<div class="vazio">Nenhum afiliado ainda. Cria o primeiro aí em cima.</div>`
      :afiliados.map(a=>{
        const r=pend[a.id]||0;
        return `<div class="afcard">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <h3>${esc(a.codigo)} ${a.ativo?"":"<span style='opacity:.5;font-size:12px'>(inativo)</span>"}</h3>
            <button class="off" onclick="toggleAfiliado(${a.id},${!a.ativo})">${a.ativo?"desativar":"reativar"}</button>
          </div>
          <div class="linha"><span>${esc(a.nome||"—")}</span><span>${a.desconto_pct}% pro cliente · ${a.comissao_pct}% comissão</span></div>
          <div class="repasse">A repassar: <b>${fmt(r)}</b>
            ${r>0?`<button class="pagarcom" style="float:right" onclick="pagarComissoes(${a.id}, this)">✓ marquei que paguei</button>`:""}</div>
        </div>`;
      }).join("")}`;
}
async function criarAfiliado(btn){
  const nome=$("af-nome").value.trim(), cod=$("af-cod").value.trim().toUpperCase();
  const desc=Number($("af-desc").value)||0, com=Number($("af-com").value)||0;
  const erro=$("af-erro");
  if(!cod){ erro.textContent="Precisa de um código."; return; }
  if(!/^[A-Z0-9]{3,20}$/.test(cod)){ erro.textContent="Código: 3 a 20 letras/números, sem espaço."; return; }
  btn.disabled=true;
  const r=await api("afiliados",{method:"POST",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({codigo:cod,tipo:"influencer",nome,desconto_pct:desc,comissao_pct:com})});
  btn.disabled=false;
  if(!r||!r.ok){ erro.textContent = r&&r.status===409?"Esse código já existe.":"Não deu pra criar."; return; }
  carregarAfiliados();
}
async function toggleAfiliado(id,ativo){
  await api(`afiliados?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({ativo})});
  carregarAfiliados();
}
async function pagarComissoes(id,btn){
  if(!confirm("Confirma que você já pagou esse afiliado por fora (Pix)? Isso zera o valor a repassar.")) return;
  btn.disabled=true;
  await api(`comissoes?afiliado_id=eq.${id}&status=eq.confirmada`,{method:"PATCH",
    body:JSON.stringify({status:"paga",paga_em:new Date().toISOString()})});
  carregarAfiliados();
}
function card(p){
  const [nx,rot] = NEXT[p.status]||[];
  const flash = !vistos.has(p.id) && p.status==="novo";
  return `<div class="pedido ${flash?"novo-flash":""}">
    ${flash?`<span class="badge">NOVO</span>`:""}
    ${p.agendado_para && new Date(p.agendado_para).getTime()>Date.now() ? `<span class="badge" style="background:var(--verde);right:auto;left:12px">⏰ AGENDADO ${new Date(p.agendado_para).toLocaleString("pt-BR",{weekday:"short",hour:"2-digit",minute:"2-digit"})}</span>`:""}
    <div class="ped-head"><span class="codigo">#${esc(p.codigo)}</span>
      <span class="hora">${new Date(p.created_at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span></div>
    <div class="cliente">${esc(p.nome)} · <a href="https://wa.me/55${(p.whatsapp||"").replace(/\D/g,"")}" target="_blank">${esc(p.whatsapp)}</a><br>
      ${p.modo==="entrega"?"🛵 "+esc(p.endereco||""):"🏠 Retirada"} · ${p.pagamento_status==="pago"?"✅ PAGO online":"pgto na entrega: "+esc(p.pagamento)}</div>
    <div class="itens">${p.itens.map(i=>`<b>${Number(i.qtd)||"?"}×</b> ${esc(i.item)}`).join("<br>")}</div>
    ${p.obs?`<div class="meta">📝 ${esc(p.obs)}</div>`:""}
    <div class="total">${fmt(p.total)}</div>
    <div class="acoes">
      ${nx?`<button class="avancar" onclick="mudarStatus(${p.id},'${nx}')">${rot}</button>`:""}
      <button class="imprimir" onclick="imprimir(${p.id})">🖨️</button>
      ${p.status==="novo"?`<button class="cancelar" onclick="mudarStatus(${p.id},'cancelado')">✕</button>`:""}
    </div>
    ${p.entrega_id ? `
    <div class="meta">🛵 Entregador ${esc(p.entrega_provedor)} já acionado${urlSegura(p.entrega_tracking_url)?` · <a href="${urlSegura(p.entrega_tracking_url)}" target="_blank" style="color:var(--verde)">rastrear 🗺️</a>`:""}</div>`
    : p.status==="pronto" && p.modo==="entrega" ? `
    <div class="acoes">
      <button class="imprimir" onclick="copiarEndereco(${p.id}, this)">📋 Copiar endereço</button>
      <button class="imprimir" onclick="cotarEntrega(${p.id})">🛵 Cotar entrega</button>
    </div>
    <div class="meta" id="cotacao-${p.id}"></div>`:""}
    </div>`;
}
async function entrar(){
  const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{
    method:"POST",headers:{apikey:SUPA_ANON,"Content-Type":"application/json"},
    body:JSON.stringify({email:$("email").value.trim(),password:$("senha").value})});
  const d = await r.json();
  if(!r.ok){ $("lerro").textContent="Login falhou — confere a senha?"; return; }
  sess={token:d.access_token, refresh:d.refresh_token, exp:Date.now()+ (d.expires_in-60)*1000};
  localStorage.setItem("rs_sess",JSON.stringify(sess));
  iniciar();
}
async function renovar(){
  const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`,{
    method:"POST",headers:{apikey:SUPA_ANON,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:sess.refresh})});
  const d = await r.json();
  if(!r.ok){ sair(); return false; }
  sess={token:d.access_token, refresh:d.refresh_token, exp:Date.now()+(d.expires_in-60)*1000};
  localStorage.setItem("rs_sess",JSON.stringify(sess));
  return true;
}
async function api(path, opts={}){
  if(Date.now()>sess.exp && !(await renovar())) return null;
  return fetch(`${SUPA_URL}/rest/v1/${path}`,{...opts,
    headers:{apikey:SUPA_ANON, Authorization:`Bearer ${sess.token}`,
      "Content-Type":"application/json", ...(opts.headers||{})}});
}
async function carregar(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const r = await api(`pedidos?created_at=gte.${hoje.toISOString()}&status=not.in.(entregue,cancelado)&pagamento_status=not.in.(pendente,falhou,estornado)&order=created_at.asc`);
  if(!r || !r.ok) return;
  const dados = await r.json();
  const novos = dados.filter(p=>p.status==="novo" && !vistos.has(p.id));
  if(novos.length && pedidos.length !== undefined && document.hasFocus()!==null){
    if(carregar.ja) bip();
  }
  const autoprint = new URLSearchParams(location.search).has("autoprint");
  const paraImprimir = carregar.ja && autoprint ? novos.filter(p=>!impressos.has(p.id)) : [];
  carregar.ja = true;
  pedidos = dados;
  if(view==="board") render();
  // modo quiosque (?autoprint=1 + Chrome --kiosk-printing): comanda sai sozinha na térmica
  for(const p of paraImprimir){
    impressos.add(p.id);
    localStorage.setItem("rs_impressos", JSON.stringify([...impressos].slice(-200)));
    imprimir(p.id);
    await new Promise(r=>setTimeout(r,1500));
  }
  setTimeout(()=>{ dados.forEach(p=>vistos.add(p.id));
    localStorage.setItem("rs_vistos",JSON.stringify([...vistos].slice(-200))); }, 8000);
}
async function mudarStatus(id, st){
  await api(`pedidos?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:st})});
  carregar();
}
function imprimir(id){
  const p = pedidos.find(x=>x.id===id); if(!p) return;
  $("comanda").textContent =
`RIO SANDO  ·  #${p.codigo}
${new Date(p.created_at).toLocaleString("pt-BR")}
--------------------------------
${p.itens.map(i=>`${i.qtd}x ${i.item}`).join("\n")}
--------------------------------
${p.obs?`OBS: ${p.obs}\n`:""}${p.modo==="entrega"?`ENTREGA: ${p.endereco}`:"RETIRADA"}
${p.nome} · ${p.whatsapp}
TOTAL ${fmt(p.total)} · ${p.pagamento.toUpperCase()} na ${p.modo==="entrega"?"entrega":"retirada"}
--------------------------------
todo sando tem alma`;
  window.print();
}
function copiarEndereco(id, btn){
  const p = pedidos.find(x=>x.id===id); if(!p) return;
  navigator.clipboard.writeText(`${p.endereco} — ${p.nome} ${p.whatsapp}`).then(()=>{
    btn.textContent = "✓ Copiado"; setTimeout(()=>btn.textContent="📋 Copiar endereço", 2000);
  });
}
async function cotarEntrega(id){
  const p = pedidos.find(x=>x.id===id); if(!p) return;
  const el = document.getElementById(`cotacao-${id}`);
  el.textContent = "cotando...";
  try{
    if(Date.now()>sess.exp && !(await renovar())) return;
    const r = await fetch(`${SUPA_URL}/functions/v1/entrega-cotar`,{
      method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${sess.token}`},
      body:JSON.stringify({endereco:p.endereco})});
    const d = await r.json();
    if(d.vencedor){
      const opcoes = d.cotacoes.filter(c=>c.disponivel).map(c=>
        `<button class="imprimir" onclick='chamarEntrega(${id},"${c.provedor}","${c.quote_id}",this)'>🛵 ${c.provedor} · R$ ${(c.preco??0).toFixed(2)}${c.coleta_min?` · ~${c.coleta_min}min`:""}</button>`).join(" ");
      el.innerHTML = `Escolhe quem leva: ${opcoes}`;
    } else {
      el.innerHTML = `Cotação automática ainda indisponível (${d.cotacoes.map(c=>c.motivo).filter((v,i,a)=>a.indexOf(v)===i).join("; ")}).<br>👉 ${d.fallback}`;
    }
  }catch(e){ el.textContent = "erro ao cotar — usa o Entrega Fácil no Gestor iFood"; }
}
async function chamarEntrega(id, provedor, quoteId, btn){
  btn.disabled = true; btn.textContent = "Chamando...";
  const el = document.getElementById(`cotacao-${id}`);
  try{
    if(Date.now()>sess.exp && !(await renovar())) return;
    const r = await fetch(`${SUPA_URL}/functions/v1/entrega-criar`,{
      method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${sess.token}`},
      body:JSON.stringify({pedido_id:id, provedor, quote_id:quoteId})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detalhe ? `${d.erro}: ${String(d.detalhe).slice(0,120)}` : d.erro);
    el.innerHTML = `✅ Entregador chamado (${provedor})${d.tracking_url?` · <a href="${d.tracking_url}" target="_blank" style="color:var(--verde)">rastrear 🗺️</a>`:""}`;
    carregar();
  }catch(e){
    btn.disabled=false; btn.textContent="tentar de novo";
    el.innerHTML += `<br>⚠️ falhou: ${e.message} — cota de novo ou usa o Entrega Fácil`;
  }
}
function bip(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.3,.6].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.setValueAtTime(.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.25);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.3);
    });
  }catch(e){}
}
function iniciar(){ render(); carregar(); clearInterval(timer); timer=setInterval(carregar,10000); }
function sair(){ sess=null; localStorage.removeItem("rs_sess"); clearInterval(timer); render(); }
sess ? iniciar() : render();
</script>
</body>
</html>
