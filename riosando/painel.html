<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rio Sandô — cozinha</title>
<style>
  :root{--preto:#1A1A1A;--creme:#F5F0EB;--vermelho:#C0392B;--verde:#2D5A27;--card:#FDFBF8;--linha:rgba(26,26,26,.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Futura,'Century Gothic',sans-serif;background:var(--preto);color:var(--creme);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  h1{font-size:20px;letter-spacing:.15em}
  h1 span{color:var(--vermelho)}
  .sub{font-size:12px;opacity:.6;letter-spacing:.1em}
  button{font-family:inherit;cursor:pointer}
  .sair{background:none;border:1px solid var(--creme);color:var(--creme);border-radius:99px;padding:7px 16px;font-size:12px}

  /* login */
  .login{max-width:360px;margin:14vh auto 0;background:var(--card);color:var(--preto);border-radius:16px;padding:28px}
  .login h2{font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--vermelho);margin-bottom:18px}
  .login label{display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin:14px 0 6px;opacity:.7}
  .login input{width:100%;font-family:inherit;font-size:15px;padding:12px;border:1px solid var(--preto);border-radius:10px;background:#fff}
  .login button{width:100%;margin-top:20px;background:var(--vermelho);color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;letter-spacing:.08em}
  .login .erro{color:var(--vermelho);font-size:12px;margin-top:10px;min-height:16px}

  /* board */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .col h2{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:10px;opacity:.8}
  .pedido{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:12px;position:relative}
  .pedido.novo-flash{outline:3px solid var(--vermelho)}
  /* pedido pronto p/ entrega mas ainda não despachado — não deixar esquecer */
  .badge-entrega{position:absolute;top:-9px;left:12px;background:var(--vermelho);color:#fff;font-size:10px;letter-spacing:.08em;padding:3px 10px;border-radius:99px;font-weight:600}
  @media (prefers-reduced-motion: no-preference){
    @keyframes pulseCard{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}50%{box-shadow:0 0 0 5px rgba(192,57,43,.5)}}
    @keyframes pulseBtn{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.025);filter:brightness(1.13)}}
    .pedido.chamar-entrega{animation:pulseCard 1.25s ease-in-out infinite}
    .enviar-btn.pulsa{animation:pulseBtn 1.05s ease-in-out infinite}
    .badge-entrega.pulsa{animation:pulseBtn 1.05s ease-in-out infinite}
  }
  .pedido.chamar-entrega{outline:2px solid var(--vermelho)}
  .ped-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .codigo{font-size:18px;font-weight:500}
  .hora{font-size:12px;opacity:.55}
  .cliente{font-size:13px;margin-bottom:8px}
  .cliente a{color:var(--verde);text-decoration:none}
  .itens{border-top:1px dashed var(--linha);padding-top:8px;font-size:14px;line-height:1.7}
  .itens b{color:var(--vermelho)}
  .meta{font-size:12px;opacity:.7;margin-top:8px;line-height:1.5}
  .total{font-size:15px;font-weight:500;margin-top:8px}
  .acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .avancar{flex:1;background:var(--preto);color:var(--creme);border:none;border-radius:10px;padding:11px;font-size:13px;letter-spacing:.05em}
  .imprimir,.cancelar{background:none;border:1px solid var(--preto);border-radius:10px;padding:11px 13px;font-size:13px}
  .cancelar{border-color:var(--vermelho);color:var(--vermelho)}
  .vazio{opacity:.4;font-size:13px;padding:14px 4px}
  .badge{position:absolute;top:-8px;right:12px;background:var(--vermelho);color:#fff;font-size:10px;letter-spacing:.1em;padding:3px 10px;border-radius:99px}
  .topbtn{background:none;border:1px solid var(--creme);color:var(--creme);border-radius:99px;padding:7px 16px;font-size:12px;margin-left:8px}
  .afcard{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:12px}
  .afcard h3{font-size:17px}
  .afcard .linha{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:6px;opacity:.8}
  .afcard .repasse{font-size:20px;font-weight:500;margin-top:10px}
  .afcard .repasse b{color:var(--vermelho)}
  .afform{background:var(--card);color:var(--preto);border-radius:14px;padding:16px;margin-bottom:16px}
  .afform label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin:10px 0 4px}
  .afform input{width:100%;font-family:inherit;font-size:15px;padding:10px;border:1px solid var(--preto);border-radius:8px;background:#fff}
  .afform .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .afform button{width:100%;margin-top:14px;background:var(--vermelho);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px}
  .pagarcom{background:var(--verde);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px}
  .off{background:var(--preto);color:var(--creme);border:none;border-radius:8px;padding:5px 10px;font-size:11px}
  /* cotação de entrega */
  .enviar-btn{width:100%;background:var(--verde);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:500;letter-spacing:.03em;margin-top:8px}
  .cot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .cotcard{background:var(--card);color:var(--preto);border:2px solid var(--linha);border-radius:12px;padding:12px;position:relative;text-align:left}
  .cotcard.melhor{border-color:var(--verde)}
  .cotcard .prov{font-size:14px;font-weight:600}
  .cotcard .preco{font-size:22px;font-weight:600;margin:4px 0 2px}
  .cotcard .det{font-size:11px;opacity:.65;line-height:1.4;min-height:28px}
  .cotcard .selo{position:absolute;top:-9px;right:8px;background:var(--verde);color:#fff;font-size:9px;letter-spacing:.06em;padding:2px 8px;border-radius:99px}
  .cotcard .chamar{width:100%;margin-top:8px;background:var(--preto);color:var(--creme);border:none;border-radius:8px;padding:9px;font-size:12.5px;font-weight:500}
  .cotcard.melhor .chamar{background:var(--verde)}
  .cot-off{background:var(--card);color:var(--preto);border:1px dashed var(--linha);border-radius:12px;padding:12px;opacity:.6;font-size:11.5px}
  .cot-ifood{display:block;text-align:center;background:#EA1D2C;color:#fff;border-radius:10px;padding:11px;font-size:13px;text-decoration:none;margin-top:8px;font-weight:500}
  @media print{
    body *{display:none}
    #comanda,#comanda *{display:block}
    #comanda{position:absolute;top:0;left:0;width:80mm;color:#000;background:#fff;
      font-family:monospace;font-size:12px;padding:4mm;line-height:1.5;white-space:pre-wrap}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="comanda"></div>
<script>
const RIO_API = "https://rio-api-517724804994.southamerica-east1.run.app";
const PGREST  = "https://postgrest-517724804994.southamerica-east1.run.app";
const FB_KEY  = "AIzaSyChnmo3XFjrFodlnnRq_ZOc2NYqdMgZKDQ";
const NEXT = {novo:["em_preparo","▶ Iniciar preparo"], em_preparo:["pronto","✔ Pronto"], pronto:["entregue","✅ Entregue / retirado"], saiu:["entregue","✅ Entregue"]};
const COLS = [["novo","🔴 Novos"],["em_preparo","🔪 Em preparo"],["pronto","📦 Prontos"],["saiu","🛵 Saiu"]];
let sess = JSON.parse(localStorage.getItem("rs_sess")||"null");
let view = "board";
let pedidos = [], vistos = new Set(JSON.parse(localStorage.getItem("rs_vistos")||"[]")), timer=null;
let impressos = new Set(JSON.parse(localStorage.getItem("rs_impressos")||"[]"));
let avisadosEntrega = new Set();  // pedidos de entrega já avisados como "prontos p/ despachar" (só nesta sessão)
const fmt = v => "R$ " + Number(v).toFixed(2).replace(".",",").replace(",00","");
const $ = id => document.getElementById(id);
// todo dado digitado pelo cliente passa por aqui antes de virar HTML (anti-XSS)
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function formaPgto(p){ const m={pix:"Pix",cartao:"Cartão","cartão":"Cartão",online:"online (Pix/cartão)",cortesia:"🎁 Cortesia",influencer:"🎁 Influencer",na_entrega:"na entrega"}; const raw=String(p.pagamento||"").trim(); if(!raw) return "—"; const parts=raw.split("·").map(s=>s.trim()).filter(Boolean); const head=m[parts[0].toLowerCase()]||esc(parts[0]); const tail=parts.slice(1).map(s=>esc(s)).join(" · "); return tail?head+" · "+tail:head; }
const urlSegura = u => typeof u==="string" && /^https:\/\/[\w.-]+\//.test(u) ? esc(u) : null;
// máscara de telefone BR: (21) 9 6899-9763 (cel) / (21) 6899-9763 (fixo)
function fmtTelBR(v){
  const d=String(v||"").replace(/\D/g,"").slice(0,11); if(!d) return "";
  const ddd=d.slice(0,2); if(d.length<=2) return "("+ddd;
  const r=d.slice(2);
  if(d.length<=6) return `(${ddd}) ${r}`;
  if(d.length<=10) return `(${ddd}) ${r.slice(0,r.length-4)}-${r.slice(-4)}`;
  return `(${ddd}) ${r.slice(0,1)} ${r.slice(1,5)}-${r.slice(5)}`;
}
function maskTel(el, store){ const p=el.selectionStart; el.value=fmtTelBR(el.value); if(store) store(el.value); }

function render(){
  const app=$("app");
  if(!sess){
    app.innerHTML=`<div class="login">
      <h2>Rio Sandô · Cozinha</h2>
      <label>E-mail</label><input id="email" type="email" value="riosandolito@gmail.com">
      <label>Senha</label><input id="senha" type="password">
      <button onclick="entrar()">Entrar</button><div class="erro" id="lerro"></div></div>`;
    return;
  }
  if(view==="afiliados"){ renderAfiliados(); return; }
  if(view==="historico"){ renderHistorico(); return; }
  if(view==="manual"){ renderManual(); return; }
  if(view==="envio"){ renderEnvioAvulso(); return; }
  if(view==="cupons"){ renderCupons(); return; }
  if(view==="agendados"){ renderAgendados(); return; }
  if(view==="novidades"){ renderNovidades(); return; }
  if(view==="reservas"){ renderReservas(); return; }
  if(view==="lanc"){ renderLanc(); return; }
  app.innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · COZINHA</h1><div class="sub">pedidos de hoje · atualiza sozinho</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end">
        <button class="topbtn" onclick="abrirPedidoManual()">➕ Pedido</button>
        <button class="topbtn" onclick="abrirEnvioAvulso()">🛵 Envio</button>
        <button class="topbtn" onclick="abrirHistorico()">📋 Histórico</button>
        <button class="topbtn" onclick="abrirAfiliados()">🤝 Afiliados</button>
        <button class="topbtn" onclick="abrirCupons()">🎟️ Cupons</button>
        <button class="topbtn" onclick="abrirAgendados()">⏰ Agendados</button>
        <button class="topbtn" onclick="abrirReservas()">🍽️ Reservas</button>
        <button class="topbtn" onclick="abrirNovidades()">🔔 Novidades<span id="nov-badge" style="display:none;background:var(--vermelho);color:#fff;border-radius:9px;padding:0 6px;margin-left:5px;font-size:11px"></span></button>
        <button class="topbtn" onclick="testarAviso()">🔊 Testar som</button>
        <button class="topbtn" onclick="abrirLancamentos()">🧾 Lançamentos</button>
        <button class="sair" onclick="sair()">Sair</button></div>
    </header>
    <div class="cols">${COLS.map(([st,titulo])=>{
      const list=pedidos.filter(p=>p.status===st);
      return `<div class="col"><h2>${titulo} (${list.length})</h2>
        ${!list.length?`<div class="vazio">nada por aqui</div>`:list.map(card).join("")}</div>`;
    }).join("")}</div>`;
}
let afiliados=[], comissoes=[], candidaturas=[], codigosUsados=new Set(), aprovandoCand=null;
// link da lojinha do afiliado (troca aqui quando o subdomínio bonito entrar)
const linkAfiliado = cod => `https://riosando.coletivo.app/${String(cod).toLowerCase()}`;
const igLink = ig => { ig=(ig||"").trim(); if(!ig) return ""; if(/^https?:/i.test(ig)) return urlSegura(ig)||""; return "https://instagram.com/"+encodeURIComponent(ig.replace(/^@/,"")); };
function abrirAfiliados(){ view="afiliados"; render(); carregarAfiliados(); }
function voltarBoard(){ view="board"; render(); }

// ── 🎟️ Cupons de promoção ──
let cupons=[];
function abrirCupons(){ view="cupons"; cupons=[]; render(); carregarCupons(); }
async function carregarCupons(){
  const r=await api("cupons?select=*&order=criado_em.desc");
  if(r&&r.ok){ cupons=await r.json(); if(view==="cupons") renderCupons(); }
}
const dCurto = s => { try{ return new Date(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"}); }catch(e){ return "—"; } };
const cupomExpirado = c => new Date(c.valido_ate).getTime() < Date.now();
function renderCupons(){
  const hoje=new Date(); const em10=new Date(Date.now()+10*864e5).toISOString().slice(0,10);
  $("app").innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · CUPONS</h1><div class="sub">promoções com validade e limite</div></div>
      <div><button class="topbtn" onclick="voltarBoard()">← Pedidos</button><button class="sair" onclick="sair()">Sair</button></div>
    </header>
    <div class="afform">
      <h3 style="margin:0 0 6px">Criar cupom</h3>
      <div class="grid">
        <div><label>Código</label><input id="c-cod" placeholder="ESTREIA10" style="text-transform:uppercase"></div>
        <div><label>Campanha (interno)</label><input id="c-camp" placeholder="Inauguração"></div>
      </div>
      <div class="grid">
        <div><label>Tipo</label><select id="c-tipo" onchange="cTipoUI()"><option value="valor">Valor fixo (R$)</option><option value="percentual">Percentual (%)</option></select></div>
        <div><label id="c-vlabel">Valor (R$)</label><input id="c-valor" type="number" inputmode="decimal" placeholder="10"></div>
      </div>
      <div class="grid">
        <div><label>Vale até</label><input id="c-ate" type="date" value="${em10}"></div>
        <div><label>Pedido mínimo (R$)</label><input id="c-min" type="number" inputmode="decimal" placeholder="25" value="25"></div>
      </div>
      <div class="grid">
        <div><label>Usos por cliente</label><input id="c-porcli" type="number" value="1"></div>
        <div><label>Usos no total (vazio = ilimitado)</label><input id="c-max" type="number" placeholder="ilimitado"></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;margin-top:10px"><input type="checkbox" id="c-primeiro" checked style="width:auto"> Só no primeiro pedido do cliente</label>
      <button onclick="criarCupom(this)">Criar cupom</button>
      <div class="erro" id="c-erro" style="color:var(--vermelho);font-size:13px;margin-top:8px"></div>
    </div>
    <h3 style="margin:6px 0 10px;font-size:15px">Cupons (${cupons.length})</h3>
    ${!cupons.length?`<div class="vazio">nenhum cupom ainda</div>`:cupons.map(c=>{
      const exp=cupomExpirado(c); const off = c.tipo==="valor"?fmt(c.valor):`${c.valor}%`;
      const usos = c.usos_max!=null ? `${c.usos}/${c.usos_max}` : `${c.usos} usos`;
      return `<div class="afcard" style="${c.ativo&&!exp?'':'opacity:.55'}">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h3 style="letter-spacing:.02em">🎟️ ${esc(c.codigo)}</h3>
          <b style="color:var(--verde);font-size:19px">−${off}</b></div>
        <div class="linha"><span>${esc(c.campanha||"—")} · mín ${fmt(c.min_pedido)}${c.primeiro_pedido?" · 1º pedido":""}</span></div>
        <div class="linha"><span>${exp?"⛔ expirado":"vale até "+dCurto(c.valido_ate)} · ${c.por_cliente_max}/cliente · ${usos}</span></div>
        <div class="acoes" style="margin-top:10px">
          <button class="off" onclick="copiarTxt('${esc(c.codigo)}',this)">📋 copiar código</button>
          <button class="off" onclick="toggleCupom('${esc(c.codigo)}',${!c.ativo})">${c.ativo?"⏸ desativar":"▶ reativar"}</button>
        </div>
      </div>`;
    }).join("")}`;
}
function cTipoUI(){ const t=$("c-tipo").value; $("c-vlabel").textContent = t==="valor"?"Valor (R$)":"Percentual (%)"; }
function copiarTxt(t,btn){ navigator.clipboard.writeText(t).then(()=>{ const o=btn.textContent; btn.textContent="✓ copiado"; setTimeout(()=>btn.textContent=o,1500); }); }
async function criarCupom(btn){
  const err=$("c-erro"); err.textContent="";
  const cod=($("c-cod").value||"").trim().toUpperCase().replace(/\s+/g,"");
  const tipo=$("c-tipo").value, valor=Number($("c-valor").value), ate=$("c-ate").value;
  const min=Number($("c-min").value)||0, porcli=Number($("c-porcli").value)||1;
  const maxRaw=$("c-max").value.trim(), usos_max=maxRaw===""?null:Number(maxRaw);
  if(!cod){ err.textContent="Põe um código."; return; }
  if(!(valor>0)){ err.textContent="Valor tem que ser maior que zero."; return; }
  if(tipo==="percentual"&&valor>100){ err.textContent="Percentual não pode passar de 100."; return; }
  if(!ate){ err.textContent="Escolhe até quando vale."; return; }
  btn.disabled=true; btn.textContent="Criando...";
  const body={codigo:cod, campanha:($("c-camp").value||"").trim()||null, tipo, valor,
    valido_ate:`${ate}T23:59:59-03:00`, min_pedido:min, por_cliente_max:porcli, usos_max,
    primeiro_pedido:$("c-primeiro").checked, ativo:true};
  const r=await api("cupons",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});
  btn.disabled=false; btn.textContent="Criar cupom";
  if(!r||!r.ok){ err.textContent = r&&r.status===409?"Já existe um cupom com esse código.":"Não deu pra criar — confere os campos."; return; }
  carregarCupons();
}
async function toggleCupom(cod,ativo){
  const r=await api(`cupons?codigo=eq.${encodeURIComponent(cod)}`,{method:"PATCH",body:JSON.stringify({ativo})});
  if(!r||!r.ok) alert("Não deu pra atualizar o cupom.");
  carregarCupons();
}
// ── Histórico de pedidos (restaurante vê tudo) ──
let historico=[];
function abrirHistorico(){ view="historico"; render(); carregarHist(); }
async function carregarHist(){
  const r=await api("pedidos?select=codigo,id,nome,whatsapp,endereco,bairro,modo,total,status,pagamento,pagamento_status,itens,created_at,entrega_provedor,entrega_id,entrega_tracking_url&order=created_at.desc&limit=150");
  if(r&&r.ok) historico=await r.json();
  if(view==="historico") filtrarHist();
}
const ROTH={novo:"recebido",em_preparo:"em preparo",pronto:"pronto",saiu:"saiu 🛵",entregue:"entregue ✅",cancelado:"cancelado ✕"};
function viaEntrega(p){ if(p.modo!=="entrega") return ""; const m={lalamove:"Lalamove",uber_direct:"Uber",manual:"delivery direto (na mão)"}; return p.entrega_provedor?` · via ${m[p.entrega_provedor]||esc(p.entrega_provedor)}`:""; }
function histCard(p){
  return `<div class="afcard">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h3>#${esc(p.codigo)}</h3><span style="font-size:12px;opacity:.6">${new Date(p.created_at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>
    <div class="linha"><span>${esc(p.nome)} · ${p.modo==="entrega"?"🛵 "+esc(p.bairro||"entrega"):"🏠 retirada"}</span><b>${fmt(p.total)}</b></div>
    <div class="linha" style="opacity:.9">${(p.whatsapp||"").replace(/\D/g,"").length>=10?`<a href="https://wa.me/55${(p.whatsapp||"").replace(/\D/g,"")}" target="_blank" style="color:var(--verde)">📱 ${esc(p.whatsapp)}</a>`:`📱 ${esc(p.whatsapp||"—")}`}${p.modo==="entrega"&&p.endereco?` · 📍 ${esc(p.endereco)}`:""}</div>
    <div class="linha" style="opacity:.8">${(p.itens||[]).map(i=>`${Number(i.qtd)||"?"}× ${esc(i.item)}`).join(", ")}</div>
    <div class="linha"><span style="opacity:.7">${ROTH[p.status]||esc(p.status)}${viaEntrega(p)} · ${p.pagamento_status==="pago"?"pago · "+formaPgto(p):(p.pagamento_status==="estornado"?"estornado":"pgto "+formaPgto(p))}</span></div>

function mSlots(){

  for(let i=0;i<=7;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i), dia=d.getDay();
    if(dia<2||dia>6) continue;
    for(let m=17*60;m<=21*60+30;m+=30){
      const s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(m/60),m%60,0);
      if(s.getTime()>now.getTime()) out.push(s);
    }
  }
  return out;
}

async function executarLanc(btn){

// monta código NOME+% a partir do @ (preferido) ou nome, resolvendo colisão
function montarCodigo(base, desc){
  base=(base||"").replace(/^@/,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase().slice(0,14);
  if(!base) return "";
  const n=Math.round(Number(desc)||0);
  let cod=base+n;
  if(!codigosUsados.has(cod)) return cod;
  for(let i=2;i<=9;i++){ if(!codigosUsados.has(base+i+n)) return base+i+n; } // GABRIEL10 → GABRIEL210
  return cod;
}
function sugerirCodigo(){
  const ig=$("af-ig").value.trim(), nome=$("af-nome").value.trim(), desc=$("af-desc").value;
  const base = ig ? ig.replace(/^@/,"").replace(/.*instagram\.com\//,"") : nome.split(" ")[0];
  const c=montarCodigo(base, desc);
  if(c) $("af-cod").value=c;
}

async function _ponte(idToken){
  const r = await fetch(`${RIO_API}/auth/token`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({firebase_token:idToken})});
  return r.ok ? await r.json() : null;
}
async function entrar(){
  pedirPermissaoAviso();
  const fr = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_KEY}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:$("email").value.trim(),password:$("senha").value,returnSecureToken:true})});
  const fd = await fr.json();
  if(!fr.ok){ $("lerro").textContent="Login falhou — confere a senha?"; return; }
  const br = await _ponte(fd.idToken);
  if(!br||!br.token){ $("lerro").textContent="Falha ao conectar — tenta de novo."; return; }
  sess={token:br.token, refresh:fd.refreshToken, exp:Date.now()+(Number(fd.expiresIn)-60)*1000};
  localStorage.setItem("rs_sess",JSON.stringify(sess));
  iniciar();
}
async function renovar(){
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_KEY}`,{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({grant_type:"refresh_token",refresh_token:sess.refresh})});
  const d = await r.json();
  if(!r.ok){ sair(); return false; }
  const br = await _ponte(d.id_token);
  if(!br||!br.token){ sair(); return false; }
  sess={token:br.token, refresh:d.refresh_token, exp:Date.now()+(Number(d.expires_in)-60)*1000};
  localStorage.setItem("rs_sess",JSON.stringify(sess));
  return true;
}
async function api(path, opts={}){
  if(Date.now()>sess.exp && !(await renovar())) return null;
  return fetch(`${PGREST}/${path}`,{...opts,
    headers:{Authorization:`Bearer ${sess.token}`,
      "Content-Type":"application/json", ...(opts.headers||{})}});
}
async function carregar(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const amanha = new Date(hoje.getTime()+864e5);
  // TODO pedido ativo (pago e não finalizado) aparece, não importa a idade — pedido antigo esquecido não pode sumir (caso Sophia 26/08)
  const r = await api(`pedidos?status=not.in.(entregue,cancelado)&pagamento_status=not.in.(pendente,falhou,estornado)&order=created_at.asc`);
  if(!r || !r.ok) return;
  const todos = await r.json();
  // board = tudo ativo, menos agendados de dias FUTUROS (esses ficam na aba ⏰ Agendados até o dia)
  const dados = todos.filter(p=>!p.agendado_para || new Date(p.agendado_para).getTime() < amanha.getTime());
  const novos = dados.filter(p=>p.status==="novo" && !vistos.has(p.id));
  if(novos.length && carregar.ja){ avisarPedido(novos.length, novos.map(p=>p.nome).join(", ")); }
  // pedido de entrega ficou pronto e ainda não foi despachado → avisa (uma vez) e o card pulsa
  const prontosEntrega = dados.filter(p=>p.status==="pronto" && p.modo==="entrega" && !p.entrega_id && !avisadosEntrega.has(p.id));
  if(prontosEntrega.length && carregar.ja) bip();
  prontosEntrega.forEach(p=>avisadosEntrega.add(p.id));
  const autoprint = new URLSearchParams(location.search).has("autoprint");
  const paraImprimir = carregar.ja && autoprint ? novos.filter(p=>!impressos.has(p.id)) : [];
  carregar.ja = true;
  pedidos = dados;
  if(view==="board") render();
  atualizarBadgeNov();
  // modo quiosque (?autoprint=1 + Chrome --kiosk-printing): comanda sai sozinha na térmica
  for(const p of paraImprimir){
    impressos.add(p.id);
    localStorage.setItem("rs_impressos", JSON.stringify([...impressos].slice(-200)));
    imprimir(p.id);
    await new Promise(r=>setTimeout(r,1500));
  }
  setTimeout(()=>{ dados.forEach(p=>vistos.add(p.id));
    localStorage.setItem("rs_vistos",JSON.stringify([...vistos].slice(-200))); }, 8000);
}
const PREV = {em_preparo:"novo", pronto:"em_preparo", saiu:"pronto", entregue:"saiu", cancelado:"novo"};

async function voltarStatus(id){
  const p=pedidos.find(x=>x.id===id); const prev=PREV[p?.status];
  if(!prev) return;
  if(!confirm(`Voltar o pedido${p?" #"+p.codigo:""} pra "${ROTH[prev]||prev}"?`)) return;
  const r=await api(`pedidos?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:prev})});
  if(!r||!r.ok) alert("Não deu pra voltar — tenta de novo.");
  carregar();
}
async function voltarProBoard(id, temEntrega){
  if(id===null){ alert("Recarrega o histórico e tenta de novo."); return; }
  const destino = temEntrega ? "saiu" : "pronto";
  if(!confirm(`Trazer esse pedido de volta pro board (como "${ROTH[destino]}")?`)) return;
  const r=await api(`pedidos?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:destino})});
  if(!r||!r.ok){ alert("Não deu pra voltar — tenta de novo."); return; }

async function mudarStatus(id, st){
  if(st==="cancelado"){
    const p=pedidos.find(x=>x.id===id);
    const pago = p && p.pagamento_status==="pago";
    const msg = pago
      ? `⚠️ Esse pedido JÁ FOI PAGO (${fmt(p.total)}).\n\nCancelar aqui NÃO devolve o dinheiro — pra devolver, use 🧾 Lançamentos → Ressarcimento depois.\n\nCancelar o pedido #${p.codigo}?`
      : `Cancelar o pedido${p?` #${p.codigo}`:""}?`;
    if(!confirm(msg)) return;
  }
  const r=await api(`pedidos?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:st})});
  if(!r||!r.ok) alert("Não deu pra mudar o status — tenta de novo.");
  carregar();
}

async function cotarEntrega(id){

      method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${sess.token}`},
      body:JSON.stringify({endereco:p.endereco})});

    const maisBarato = [...disp].sort((a,b)=>(a.preco??1e9)-(b.preco??1e9))[0]?.provedor;
    const comTempo = disp.filter(c=>c.coleta_min);
    const maisRapido = comTempo.length ? [...comTempo].sort((a,b)=>a.coleta_min-b.coleta_min)[0]?.provedor : null;
    const cards = d.cotacoes.map(c=>{
      if(!c.disponivel) return `<div class="cot-off">✕ ${nomeP(c.provedor)}<br>${esc(c.motivo||"indisponível")}</div>`;
      const selo = c.provedor===maisBarato ? "💚 MAIS BARATO" : (c.provedor===maisRapido ? "⚡ MAIS RÁPIDO" : "");
      const det=[c.veiculo, c.coleta_min?`busca ~${c.coleta_min}min`:"", c.eta?`entrega ~${c.eta}`:"", c.distancia?`${c.distancia} km`:""].filter(Boolean).join(" · ");
      return `<div class="cotcard ${c.provedor===maisBarato?"melhor":""}">
        ${selo?`<span class="selo">${selo}</span>`:""}
        <div class="prov">${nomeP(c.provedor)}</div>

      </div>`;
    }).join("");

    el.innerHTML = `<div class="cot-grid">${cards}</div>
      <a class="cot-ifood" href="https://portal.ifood.com.br" target="_blank">🔴 ou pedir entregador pelo iFood</a>
      ${algum?"":`<div style="margin-top:6px;font-size:12px;opacity:.7">Nenhum app cotou — usa o iFood acima 👆</div>`}`;
  }catch(e){ el.innerHTML = `<div style="font-size:12px;opacity:.8;margin-top:8px">erro ao cotar. <a class="cot-ifood" href="https://portal.ifood.com.br" target="_blank">🔴 pedir entregador pelo iFood</a></div>`; }
}
async function chamarEntrega(id, provedor, quoteId, btn){
  const nome = provedor==="lalamove"?"Lalamove":provedor==="uber_direct"?"Uber":provedor;
  if(!confirm(`Isso chama um motoboy DE VERDADE (${nome}) e cobra na conta. Confirma?`)) return;
  btn.disabled = true; btn.textContent = "Chamando...";
  const el = document.getElementById(`cotacao-${id}`);
  try{
    if(Date.now()>sess.exp && !(await renovar())){ alert("Sessão expirou — entra de novo e CONFERE se a ação anterior completou antes de repetir."); return; }
    const r = await fetch(`${RIO_API}/entrega-criar`,{
      method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${sess.token}`},
      body:JSON.stringify({pedido_id:id, provedor, quote_id:quoteId})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detalhe ? `${d.erro}: ${String(d.detalhe).slice(0,120)}` : d.erro);
    el.innerHTML = `✅ Entregador chamado (${esc(provedor)})${urlSegura(d.tracking_url)?` · <a href="${urlSegura(d.tracking_url)}" target="_blank" style="color:var(--verde)">rastrear 🗺️</a>`:""}`;
    carregar();
  }catch(e){
    btn.disabled=false; btn.textContent="tentar de novo";
    el.innerHTML += `<br>⚠️ falhou: ${e.message} — cota de novo ou usa o Entrega Fácil`;
  }
}
async function cancelarEntrega(id, btn){
  if(!confirm("Cancelar a corrida com o entregador? Faça isso só antes do motoboy retirar.")) return;
  btn.disabled = true; btn.textContent = "Cancelando...";
  try{
    if(Date.now()>sess.exp && !(await renovar())){ alert("Sessão expirou — entra de novo e CONFERE se a ação anterior completou antes de repetir."); return; }
    const r = await fetch(`${RIO_API}/entrega-cancelar`,{
      method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${sess.token}`},
      body:JSON.stringify({pedido_id:id})});
    const d = await r.json();
    if(!r.ok || !d.ok) throw new Error(d.erro || "não deu");

  }catch(e){
    btn.disabled=false; btn.textContent="✕ cancelar entrega";
    alert("Não cancelou: "+e.message+"\nSe o motoboy já retirou, cancele direto no app do provedor.");
  }
}

async function carregarReservas(){
  const hoje=new Date(); hoje.setHours(0,0,0,0); const H=hoje.toISOString().slice(0,10);
  const [rs,rr]=await Promise.all([
    api(`reserva_slots?data=gte.${H}&order=data,hora`),
    api(`reservas?status=eq.confirmada&data=gte.${H}&select=*&order=data,hora`)
  ]);

function fmtDataBR(d){ const [y,m,dd]=d.split("-"); const dt=new Date(+y,+m-1,+dd); return `${DIAS_SEM[dt.getDay()]} ${dd}/${m}`; }
async function criarSlot(btn){
  const data=$("rs-data").value, hora=$("rs-hora").value, mesas=Number($("rs-mesas").value)||3;
  const msg=$("rs-msg"); if(!data||!hora){ msg.textContent="Escolhe data e horário."; return; }
  btn.disabled=true;
  const r=await api("reserva_slots",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({data,hora,mesas})});
  btn.disabled=false;
  if(!r||!r.ok){ msg.textContent = r&&r.status===409?"Esse horário já existe.":"Não deu pra abrir."; return; }
  msg.textContent="Horário aberto ✅"; carregarReservas();
}
async function gerarRecorrencia(btn){
  const dias=[...document.querySelectorAll(".rec-dia:checked")].map(x=>+x.value);
  const horas=($("rec-horas").value||"").split(",").map(s=>s.trim()).filter(Boolean);
  const semanas=Number($("rec-semanas").value)||4;
  const mesas=Number($("rs-mesas").value)||3;
  const msg=$("rec-msg");
  if(!dias.length||!horas.length){ msg.textContent="Escolhe os dias e os horários (ex: 19:00, 20:30)."; return; }
  const hoje=new Date(); hoje.setHours(0,0,0,0); const slots=[];
  for(let i=0;i<semanas*7;i++){ const d=new Date(hoje.getTime()+i*864e5); if(dias.includes(d.getDay())){ const ds=d.toISOString().slice(0,10); for(const hh of horas) slots.push({data:ds,hora:hh.length===5?hh+":00":hh,mesas}); } }
  if(!slots.length){ msg.textContent="Nenhuma data gerada."; return; }
  btn.disabled=true; msg.textContent=`Abrindo ${slots.length} horários...`;
  const r=await api("reserva_slots",{method:"POST",headers:{Prefer:"return=minimal,resolution=ignore-duplicates"},body:JSON.stringify(slots)});
  btn.disabled=false;
  msg.textContent = (r&&r.ok)?`✅ ${slots.length} horários abertos (recorrência ${semanas} semanas)`:"Não deu pra gerar.";
  carregarReservas();
}

let novVistas = Number(localStorage.getItem("rs_nov_vistas")||0);
function atualizarBadgeNov(){ const b=document.getElementById("nov-badge"); if(!b) return; const n=NOVIDADES.length-novVistas; if(n>0){ b.textContent=n; b.style.display="inline"; } else b.style.display="none"; }
let fbNota=0, feedbacks=[];
function abrirNovidades(){ view="novidades"; novVistas=NOVIDADES.length; localStorage.setItem("rs_nov_vistas",String(novVistas)); render(); atualizarBadgeNov(); carregarFeedback(); }
async function carregarFeedback(){ const r=await api("feedback?select=*&order=criado_em.desc&limit=50"); if(r&&r.ok){ feedbacks=await r.json(); const el=document.getElementById("fb-lista"); if(el) el.innerHTML = feedbacks.length? feedbacks.map(f=>`<div class="afcard"><div style="display:flex;justify-content:space-between"><b>${"⭐".repeat(f.nota||0)||"—"} · ${esc(f.tipo||"")}${f.contexto?` · ${esc(f.contexto)}`:""}</b><span style="font-size:11px;opacity:.6">${new Date(f.criado_em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div><div class="linha" style="display:block;opacity:.85">${esc(f.comentario||"")}</div>${f.quem?`<div class="linha" style="opacity:.6">— ${esc(f.quem)}</div>`:""}</div>`).join("") : `<div class="vazio">nenhum feedback ainda</div>`; } }
function setNota(n){ fbNota=n; document.querySelectorAll(".fb-star").forEach((s,i)=>s.textContent=i<n?"⭐":"☆"); }
async function enviarFeedback(btn){
  const tipo=document.getElementById("fb-tipo").value, com=document.getElementById("fb-com").value.trim(), quem=document.getElementById("fb-quem").value.trim();
  const msg=document.getElementById("fb-msg");
  if(!fbNota && !com){ msg.textContent="Dá uma nota ou escreve algo 🙏"; return; }
  btn.disabled=true; btn.textContent="Enviando...";
  const r=await api("feedback",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({nota:fbNota||null,tipo,comentario:com||null,quem:quem||null,contexto:"delivery-direto"})});
  btn.disabled=false; btn.textContent="Enviar feedback";
  if(!r||!r.ok){ msg.textContent="Não deu pra enviar — tenta de novo."; return; }
  msg.textContent="Valeu! Feedback registrado ✅"; fbNota=0; document.getElementById("fb-com").value=""; setNota(0); carregarFeedback();
}
function renderNovidades(){
  $("app").innerHTML=`<header>
      <div><h1>RIO SAND<span>Ô</span> · NOVIDADES</h1><div class="sub">o que mudou no sistema · mais recente primeiro</div></div>
      <div><button class="topbtn" onclick="voltarBoard()">← Pedidos</button><button class="sair" onclick="sair()">Sair</button></div>
    </header>
    ${NOVIDADES.map(n=>`<div class="afcard">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <h3>${esc(n[1])}</h3><span style="font-size:12px;opacity:.6">${esc(n[0])}</span></div>
      <div class="linha" style="opacity:.85;display:block">${esc(n[2])}</div>
    </div>`).join("")}
    <div class="afform" style="margin-top:16px">
      <h3 style="margin:0 0 10px">💬 Avaliar o sistema de delivery direto</h3>
      <div style="font-size:26px;letter-spacing:4px;cursor:pointer">${[1,2,3,4,5].map(n=>`<span class="fb-star" onclick="setNota(${n})">☆</span>`).join("")}</div>
      <label>Tipo</label><select id="fb-tipo"><option value="melhoria">💡 Pedido de melhoria</option><option value="bug">🐞 Algo com problema</option><option value="elogio">❤️ Elogio</option></select>
      <label>Comentário</label><textarea id="fb-com" rows="3" placeholder="O que funcionou, o que travou, o que melhorar..." style="width:100%;font-family:inherit;font-size:15px;padding:10px;border:1px solid var(--preto);border-radius:8px;background:#fff"></textarea>
      <label>Seu nome (opcional)</label><input id="fb-quem" placeholder="quem está avaliando">
      <button onclick="enviarFeedback(this)">Enviar feedback</button>
      <div class="mp-note" id="fb-msg" style="margin-top:8px"></div>
    </div>
    <h3 style="margin:18px 0 10px;font-size:15px">Feedbacks recebidos</h3>
    <div id="fb-lista"><div class="vazio">carregando...</div></div>`;
}
// ── AVISO DE PEDIDO NOVO (notificação nativa + título piscando + beep) ──
let _tituloBase = document.title || "Rio Sandô · Cozinha", _flash=null, _pend=0;
function pedirPermissaoAviso(){ try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission(); }catch(e){} }
function avisarPedido(qtd, texto){
  bip();
  try{
    if("Notification" in window && Notification.permission==="granted"){
      const n=new Notification("🔔 Novo pedido no app!", {body:texto||`${qtd} pedido(s) novo(s)`, tag:"rs-novo", renotify:true, requireInteraction:true});
      n.onclick=()=>{ try{window.focus();}catch(e){} n.close(); };
    }
  }catch(e){}
  _pend += qtd;
  if(!_flash){ let on=false; _flash=setInterval(()=>{ on=!on; document.title = on?`🔴 (${_pend}) PEDIDO NOVO`:_tituloBase; }, 900); }
}
function limparAviso(){ _pend=0; if(_flash){ clearInterval(_flash); _flash=null; } document.title=_tituloBase; }
window.addEventListener("focus", limparAviso);
function testarAviso(){ pedirPermissaoAviso(); setTimeout(()=>avisarPedido(1,"teste de aviso — se você viu/ouviu isso, está funcionando ✅"),300); }
function bip(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.3,.6].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.setValueAtTime(.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.25);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.3);
    });
  }catch(e){}
}
function iniciar(){ render(); carregar(); clearInterval(timer); timer=setInterval(carregar,10000); }
function sair(){ sess=null; localStorage.removeItem("rs_sess"); clearInterval(timer); render(); }
sess ? iniciar() : render();
</script>
