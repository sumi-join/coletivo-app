<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rio Sandô — Área do divulgador</title>
<style>
  :root{--preto:#1A1A1A;--creme:#F5F0EB;--vermelho:#C0392B;--verde:#2D5A27;--card:#FDFBF8;--linha:rgba(26,26,26,.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Futura,'Century Gothic','Jost',sans-serif;background:var(--creme);color:var(--preto);line-height:1.55}
  .wrap{max-width:560px;margin:0 auto;padding:40px 22px 64px}
  .kana{color:var(--vermelho);font-size:11px;letter-spacing:.5em;margin-bottom:8px}
  h1{font-size:26px;letter-spacing:.03em;margin-bottom:8px}
  .sub{opacity:.65;font-size:14px;margin-bottom:28px}
  label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin:16px 0 6px}
  input{width:100%;font-family:inherit;font-size:17px;padding:13px 15px;border:1px solid var(--preto);border-radius:10px;background:#fff;text-transform:uppercase}
  button{width:100%;margin-top:16px;font-family:inherit;background:var(--vermelho);color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;letter-spacing:.05em;cursor:pointer}
  .msg{font-size:13.5px;margin-top:12px;text-align:center;min-height:16px;color:var(--vermelho)}
  .card{background:var(--preto);color:var(--creme);border-radius:16px;padding:22px;margin-top:8px}
  .card h2{font-size:18px;margin-bottom:4px}
  .card .desc{opacity:.7;font-size:13.5px;margin-bottom:16px}
  .codebox{background:var(--creme);color:var(--preto);border-radius:10px;padding:14px;text-align:center;font-size:24px;letter-spacing:.2em;font-weight:500;margin-bottom:8px}
  .linkbox{background:rgba(245,240,235,.12);border:1px solid rgba(245,240,235,.25);border-radius:10px;padding:12px;font-size:13px;word-break:break-all;margin-bottom:12px}
  .btn2{background:var(--verde)}
  .btn3{background:transparent;border:1px solid var(--creme);color:var(--creme)}
  .how{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:18px;margin-top:16px}
  .how h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--vermelho);margin-bottom:10px}
  .how .step{display:flex;gap:10px;margin-bottom:10px;font-size:14px}
  .how .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--vermelho);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--linha);font-size:12px;letter-spacing:.14em;opacity:.5;text-transform:uppercase}
  a{color:var(--vermelho)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kana">サンド</div>
  <h1>Área do divulgador</h1>
  <div class="sub">Já é afiliado do Rio Sandô? Digite seu código pra pegar seu link e material de divulgação. 🥪</div>

  <div id="entrada">
    <label>Seu código de afiliado</label>
    <input id="cod" placeholder="EX: GABRIEL10" autocomplete="off">
    <button onclick="buscar(this)">Acessar minha lojinha</button>
    <div class="msg" id="msg"></div>
    <div style="text-align:center;margin-top:18px;font-size:13.5px">Ainda não é divulgador? <a href="afiliados.html">Candidate-se aqui →</a></div>
  </div>

  <div id="area" style="display:none"></div>
  <footer>Rio Sandô · Botafogo, Rio · coletivo.app</footer>
</div>
<script>
const SUPA_URL="https://xngsucsxqbmvdnyuabll.supabase.co";
const SUPA_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuZ3N1Y3N4cWJtdmRueXVhYmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDg1MTYsImV4cCI6MjEwMjcyNDUxNn0.P5vuyAyooZ_BArc_lC7HiQ2N-p0Fi7ejpxzyehPSi1Q";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// link bonito quando o subdomínio entrar; por ora o ?cupom= funciona
const linkDe = cod => `https://coletivo.app/riosando/?cupom=${cod}`;
async function buscar(btn){
  const cod=document.getElementById("cod").value.trim().toUpperCase();
  const msg=document.getElementById("msg");
  if(!cod){ msg.textContent="Digite seu código."; return; }
  btn.disabled=true; btn.textContent="Buscando...";
  try{
    const r=await fetch(`${SUPA_URL}/functions/v1/validar-cupom`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({cupom:cod, subtotal:0})});
    const d=await r.json();
    btn.disabled=false; btn.textContent="Acessar minha lojinha";
    if(!d.ok){ msg.textContent = d.motivo && /indicação/.test(d.motivo) ? "Esse é um código de indicação de cliente, não de divulgador." : "Código não encontrado ou inativo. Confere com a gente no WhatsApp."; return; }
    mostrar(cod, d.nome, d.desconto_pct);
  }catch(e){ btn.disabled=false; btn.textContent="Acessar minha lojinha"; msg.textContent="Não deu pra buscar agora. Tenta de novo?"; }
}
function mostrar(cod, nome, pct){
  document.getElementById("entrada").style.display="none";
  const link=linkDe(cod);
  document.getElementById("area").style.display="block";
  document.getElementById("area").innerHTML=`
    <div class="card">
      <h2>Oi, ${esc(nome||"divulgador")}! 👋</h2>
      <div class="desc">Sua lojinha dá <b>${pct}% de desconto</b> pra quem pede pelo seu link, e você ganha comissão.</div>
      <label style="opacity:.7;color:var(--creme)">Seu código (pra caption/WhatsApp)</label>
      <div class="codebox">${esc(cod)}</div>
      <label style="opacity:.7;color:var(--creme)">Seu link (pra Stories/bio)</label>
      <div class="linkbox">${esc(link)}</div>
      <button class="btn2" onclick="compartilhar('${esc(cod)}','${esc(link)}',this)">📲 Compartilhar minha lojinha</button>
      <button class="btn3" onclick="copiar('${esc(link)}',this)">🔗 Copiar link</button>
    </div>
    <div class="how">
      <h3>Como divulgar</h3>
      <div class="step"><span class="n">1</span><div><b>Stories:</b> use o sticker de link com seu link acima (funciona em qualquer conta).</div></div>
      <div class="step"><span class="n">2</span><div><b>Posts/caption:</b> peça pra usarem seu código <b>${esc(cod)}</b> na sacola.</div></div>
      <div class="step"><span class="n">3</span><div>A cada pedido feito com o seu, você ganha comissão (a gente acerta no seu Pix).</div></div>
      <p style="font-size:12.5px;opacity:.6;margin-top:6px">Dúvidas ou pra saber quanto você já tem a receber, <a href="https://wa.me/5521978857339" target="_blank">chama a gente no WhatsApp</a>.</p>
    </div>`;
}
function compartilhar(cod, link, btn){
  const texto=`Pede um katsu sando do Rio Sandô com meu link e ganha desconto 🥪⛩️\n${link}`;
  if(navigator.share){ navigator.share({title:"Rio Sandô",text:texto,url:link}).catch(()=>{}); return; }
  navigator.clipboard.writeText(texto).then(()=>{ btn.textContent="✓ Copiado — cola no Insta/WhatsApp"; });
}
function copiar(txt,btn){ navigator.clipboard.writeText(txt).then(()=>{ btn.textContent="✓ link copiado"; }); }
</script>
</body>
</html>
