<style>
  :root{
    --preto:#1A1A1A; --creme:#F5F0EB; --vermelho:#C0392B; --verde:#2D5A27;

  html{-webkit-text-size-adjust:100%}

  .wordmark{font-weight:500;font-size:26px;letter-spacing:.06em;line-height:1;display:flex;align-items:center;gap:2px}
  .wordmark .oq{display:inline-block;width:.72em;height:.72em;border:3px solid var(--preto);border-radius:2px;margin:0 .06em}
  .wordmark .osym{display:inline-block;position:relative;width:.72em;height:.72em;border:3px solid var(--preto);border-radius:2px;margin-left:.06em}
  .wordmark .osym::before{content:"";position:absolute;left:2px;right:2px;top:38%;height:26%;background:var(--vermelho)}
  .wordmark .osym::after{content:"";position:absolute;left:20%;right:20%;top:-9px;height:3px;background:var(--preto)}

  .status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;
    background:var(--preto);color:var(--creme);padding:6px 12px;border-radius:99px}
  .dot{width:7px;height:7px;border-radius:50%;background:#7CBF6B}
  .dot.off{background:#C0392B}
  .alma{font-style:italic;font-size:12.5px;opacity:.55}
  .fechado-banner{background:var(--preto);color:var(--creme);font-size:14px;line-height:1.55;
    padding:12px 16px;border-radius:12px;margin-top:12px}
  .ultimo-pedido{display:inline-block;margin-top:10px;margin-left:10px;font-size:13px;color:var(--verde);
    text-decoration:underline;cursor:pointer}
  .destaque-badge{position:absolute;top:12px;left:12px;background:var(--creme);color:var(--preto);
    font-size:12px;letter-spacing:.08em;padding:6px 12px;border-radius:99px;box-shadow:0 2px 8px rgba(26,26,26,.25)}
  .card{position:relative}

  /* category nav */
  nav{position:sticky;top:0;background:var(--creme);z-index:20;padding:12px 0;border-bottom:1px solid var(--linha)}

  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-family:inherit;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    padding:10px 16px;border-radius:99px;border:1px solid var(--preto);background:transparent;color:var(--preto);cursor:pointer}

  .card h3{font-size:17.5px;font-weight:500;line-height:1.35}
  .card p{font-size:14px;opacity:.62;margin-top:6px;line-height:1.5}
  .preco{font-size:16.5px;color:var(--vermelho);white-space:nowrap;font-weight:500}
  .add{display:flex;align-items:center;gap:12px;margin-top:14px}
  .btn-add,.btn-qty{font-family:inherit;border:1px solid var(--preto);background:var(--preto);color:var(--creme);

  .btn-qty{padding:8px 15px;font-size:16px;line-height:1}
  .qtd{min-width:22px;text-align:center;font-size:16px}
  .linha-item{display:flex;justify-content:space-between;align-items:center;padding:16px 2px;border-bottom:1px solid var(--linha);gap:12px}
  .linha-item:last-child{border-bottom:none}
  .linha-item h3{font-size:15.5px;font-weight:500;line-height:1.4}
  .linha-item p{font-size:13px;opacity:.58;margin-top:3px}
  .mini-add{display:flex;align-items:center;gap:8px}
  .nota{font-size:11.5px;opacity:.55;margin:6px 2px 0}
  .vinhos{background:var(--preto);color:var(--creme);border-radius:14px;padding:18px;margin-top:14px}
  .vinhos h3{font-size:15px;margin-bottom:6px}
  .vinhos p{font-size:12.5px;opacity:.75;line-height:1.5}

  .cartbar button{width:100%;max-width:480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;

  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--creme);border-radius:20px 20px 0 0;

  .total-row{display:flex;justify-content:space-between;font-size:18px;font-weight:500;padding:18px 2px;border-top:2px solid var(--preto);margin-top:10px}

  .menu-nav{display:flex;flex-direction:column}

  .menu-nav a span{font-size:12.5px;opacity:.6;margin-top:3px}
  .menu-nav a:active{background:rgba(26,26,26,.05)}
  .conta-chip{display:inline-flex;align-items:center;gap:7px;margin-left:8px;margin-top:10px;cursor:pointer;
    font-family:inherit;border:1px solid var(--linha);background:var(--creme-card);color:var(--preto);
    border-radius:99px;padding:4px 10px 4px 4px;font-size:12.5px}
  .conta-chip .av{width:24px;height:24px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;
    justify-content:center;background:var(--preto);color:var(--creme);font-size:12px;font-weight:600}
  .conta-chip .nm{font-weight:500;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conta-chip .cpts{background:var(--preto);color:var(--creme);border-radius:99px;padding:2px 8px;font-size:11.5px}
  .pts-box{background:var(--preto);color:var(--creme);border-radius:14px;padding:18px;text-align:center;margin-top:4px}

  .nudge-conta{font-size:13.5px;color:var(--verde);margin-top:14px;cursor:pointer;text-decoration:underline}
  .news{background:var(--creme-card);border:1px solid var(--linha);border-left:4px solid var(--vermelho);

  .lojinha{background:var(--verde);color:#fff;border-radius:12px;padding:13px 16px;margin-top:12px;
    font-size:14px;line-height:1.5}
  .lojinha b{font-weight:600}
  .convite{background:var(--preto);color:var(--creme);border-radius:14px;padding:18px;margin-top:24px}
  .convite b.titulo{color:#fff;letter-spacing:.08em;font-size:12px;text-transform:uppercase}
  .convite p{font-size:13px;opacity:.85;line-height:1.55;margin-top:8px}
  .codigo-box{background:var(--creme);color:var(--preto);border-radius:10px;padding:14px;margin-top:12px;
    text-align:center;font-size:26px;letter-spacing:.3em;font-weight:500}
  .cupom-row{display:flex;gap:8px;margin-top:8px}
  .cupom-row input{flex:1;text-transform:uppercase}
  .cupom-row button{flex:0 0 auto;font-family:inherit;background:var(--preto);color:var(--creme);
    border:none;border-radius:10px;padding:0 18px;font-size:14px;cursor:pointer}
  .cupom-ok{font-size:13px;color:var(--verde);margin-top:6px}
  .cupom-erro{font-size:13px;color:var(--vermelho);margin-top:6px}
  .toggle{display:flex;gap:10px;margin-top:8px}
  .toggle button{flex:1;font-family:inherit;font-size:14px;letter-spacing:.05em;padding:14px 10px;border-radius:10px;
    border:1px solid var(--preto);background:transparent;color:var(--preto);cursor:pointer}
  .toggle button.on{background:var(--preto);color:var(--creme)}
  .pagar{width:100%;margin-top:22px;font-family:inherit;background:var(--vermelho);color:#fff;border:none;
    border-radius:14px;padding:17px;font-size:15px;letter-spacing:.08em;cursor:pointer}
  .mp-note{font-size:13px;opacity:.6;text-align:center;margin-top:12px;line-height:1.5}
  .vazio{text-align:center;opacity:.5;padding:32px 0;font-size:15px}

  /* confirmação */
  .ok-box{text-align:center;padding:26px 0 10px}
  .ok-box .osym{width:54px;height:54px;border-width:4px;margin:0 auto 18px;display:block;position:relative;border:4px solid var(--preto);border-radius:4px}
  .ok-box .osym::before{content:"";position:absolute;left:4px;right:4px;top:38%;height:26%;background:var(--vermelho)}
  .ok-box h3{font-size:20px;margin-bottom:8px}
  .ok-box p{font-size:13.5px;opacity:.65;line-height:1.5}
  footer{margin-top:48px;padding:24px 0 34px;border-top:1px solid var(--linha);font-size:12px;letter-spacing:.14em;opacity:.5;text-transform:uppercase}

  /* desktop */
  @media(min-width:900px){
    .wrap{max-width:980px}
    .chips{max-width:980px}
    header .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 24px}
    header .wrap > div:first-child{flex-basis:100%;display:none}
    section{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
    section h2{grid-column:1/-1}
    section .linha-item{grid-column:1/-1}
    .card img{aspect-ratio:16/9}
    .sheet{max-width:560px;left:50%;transform:translate(-50%,105%);border-radius:20px 20px 0 0}
    .sheet.on{transform:translate(-50%,0)}
  }
</style>
</head>

function _trAuth(e) { const m = (e?.message || "") + "";
  if (/EMAIL_EXISTS/.test(m)) return { message: "esse e-mail já tem conta — faça login" };
  if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return { message: "e-mail ou senha incorretos" };
  if (/WEAK_PASSWORD/.test(m)) return { message: "senha muito curta (mín. 6)" };
  if (/INVALID_EMAIL/.test(m)) return { message: "e-mail inválido" };
  return { message: "não deu certo — tenta de novo" };
}
async function _bridge(idToken) {
  const r = await fetch(`${RIO_API}/auth/token`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ firebase_token: idToken }) });

}
async function _establish(fb) {

  const s = { token: br.token, refresh: fb.refreshToken, exp: Date.now() + (Number(fb.expiresIn) - 60) * 1000, fb_id: fb.idToken, user: { id: br.uid, email: br.email, nome: br.nome, foto: br.foto } };

}
async function _refresh() {

  if (!r.ok) { _save(null); _emit("SIGNED_OUT"); return false; }

}

class PgQ {
  constructor(t){this.t=t;this.op="select";this.cols="*";this.flt=[];this.ord=null;this.lim=null;this.one=null;this.pl=null;}
  select(c="*"){this.cols=c;return this;} eq(c,v){this.flt.push(`${c}=eq.${encodeURIComponent(v)}`);return this;}
  order(c,o={}){this.ord=`${c}.${o.ascending===false?"desc":"asc"}`;return this;} limit(n){this.lim=n;return this;}
  maybeSingle(){this.one="maybe";return this;} single(){this.one="one";return this;}
  insert(r){this.op="insert";this.pl=r;return this;} upsert(r){this.op="upsert";this.pl=r;return this;} update(r){this.op="update";this.pl=r;return this;}
  async _run(){
    const tok=await _token(); const h={"Content-Type":"application/json"}; if(tok)h.Authorization=`Bearer ${tok}`;
    let url=`${PGREST}/${this.t}`,method="GET",body; const qs=[];
    if(this.op==="select"){qs.push(`select=${encodeURIComponent(this.cols)}`);this.flt.forEach(f=>qs.push(f));if(this.ord)qs.push(`order=${this.ord}`);if(this.lim)qs.push(`limit=${this.lim}`);}
    else if(this.op==="insert"){method="POST";body=JSON.stringify(this.pl);h.Prefer="return=representation";}
    else if(this.op==="upsert"){method="POST";body=JSON.stringify(this.pl);h.Prefer="resolution=merge-duplicates,return=representation";}
    else if(this.op==="update"){method="PATCH";this.flt.forEach(f=>qs.push(f));body=JSON.stringify(this.pl);h.Prefer="return=representation";}
    if(this.one==="one")h.Accept="application/vnd.pgrst.object+json";
    if(qs.length)url+="?"+qs.join("&");
    try{const r=await fetch(url,{method,headers:h,body});const txt=await r.text();let data=txt?JSON.parse(txt):null;
      if(!r.ok)return{data:null,error:(data&&(data.message||data.code))?data:{message:`erro ${r.status}`}};
      if(this.one==="maybe")data=Array.isArray(data)?(data[0]??null):data; return{data,error:null};
    }catch(e){return{data:null,error:{message:String(e)}};}
  }
  then(res,rej){return this._run().then(res,rej);}
}

// Firebase SDK usado SÓ pro popup do Google (e-mail/senha segue via REST no shim)
let _fbAuth=null;
function _initFirebase(){
  if(_fbAuth) return _fbAuth;
  if(typeof firebase==="undefined") return null;
  if(!firebase.apps?.length) firebase.initializeApp({apiKey:FB_KEY, authDomain:"rio-sando.firebaseapp.com", projectId:"rio-sando"});
  _fbAuth = firebase.auth();
  return _fbAuth;
}
async function _googleLogin(){
  const auth = _initFirebase();
  if(!auth) return {data:null, error:{message:"Google indisponível agora — use e-mail e senha."}};
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:"select_account"});
  try{
    const res = await auth.signInWithPopup(prov);
    const idToken = await res.user.getIdToken();
    const rt = res.user.refreshToken;
    const out = await _establish({idToken, refreshToken:rt, expiresIn:3600});
    try{ await auth.signOut(); }catch(e){}
    return out;
  }catch(e){
    const c=(e&&e.code)||"";
    if(/popup-closed-by-user|cancelled-popup-request|popup-blocked/.test(c)) return {data:null, error:{message:""}};
    return {data:null, error:{message:"não deu pra entrar com Google — tenta de novo"}};
  }
}

// horário: ter(2)–sáb(6), 17h–21h30 — fora disso o pedido entra agendado
function lojaAberta(d=new Date()){
  const dia=d.getDay(), m=d.getHours()*60+d.getMinutes();
  return dia>=2 && dia<=6 && m>=17*60 && m<=21*60+30;
}
function proximaAbertura(){
  const d=new Date();
  for(let i=0;i<8;i++){
    const c=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i,17,0,0);
    if(c.getDay()>=2 && c.getDay()<=6 && c.getTime()>d.getTime()) return c;
  }
  return d;
}

  const p=proximaAbertura(), hoje=new Date();

}

async function buscarCep(cep, ctx){
  ctx = ctx||"checkout"; const A = CEP_ALVO[ctx];
  const msg = document.getElementById(A.msg);
  const setMsg = (t,cor="") => { if(msg){ msg.textContent=t; msg.style.color=cor; } };
  setMsg("🔎 buscando o endereço…");
  try{
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d = await r.json();
    if(d.erro) return setMsg("CEP não encontrado — pode digitar o endereço à mão. 🙏","var(--vermelho)");
    if(normStr(d.localidade)!=="rio de janeiro") return setMsg("Esse CEP não é do Rio — por enquanto entregamos só na Zona Sul. 🙈","var(--vermelho)");
    const b = BAIRRO_NORM[normStr(d.bairro)];
    const end = document.getElementById(A.end);
    if(end && d.logradouro) end.value = d.logradouro + ", ";
    const sel = document.getElementById(A.bairro);
    if(b){
      if(sel) sel.value=b;
      if(ctx==="checkout") bairro = b;
      setMsg(`📍 ${d.logradouro?d.logradouro+" · ":""}${b}`,"var(--verde)");
    } else {
      setMsg(`📍 ${d.bairro||"esse bairro"} — fora da nossa área (Botafogo → Gávea) por enquanto. 🙈`,"var(--vermelho)");
    }
    if(A.cota){ freteCotado=null; freteToken=null; atualizarFrete(); }
    if(end){ end.focus(); const L=end.value.length; try{ end.setSelectionRange(L,L); }catch(e){} }
    if(A.cota) cotarFrete();
  }catch{ setMsg("Não deu pra buscar o CEP — digita o endereço à mão. 🙏","var(--vermelho)"); }
}

  freteStatus="calculando"; atualizarFrete();

    const r = await fetch(`${RIO_API}/frete-cliente`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({endereco:end, bairro})});
    const d = await r.json().catch(()=>({}));

}
function restaurarForm(f){
  if(!f) return;
  for(const [id,val] of Object.entries(f)){
    const el = document.getElementById(id);
    if(el && val!==null) el.value = val;
  }
}
function reabrirSacola(){ const f=lerForm(); abrirSacola(); restaurarForm(f); }

// resgate em blocos de R$5 (100 pts), limitado ao valor da comida
function maxDesconto(){
  if(!sessao || saldoPts<100 || cupomInfo) return 0;
  const {t}=totais();
  return Math.min(Math.floor(saldoPts/100), Math.floor(t/5))*5;
}
const descontoAtual = () => usarPontos && !cupomInfo ? maxDesconto() : 0;
// cupom de valor fixo (promo) desconta o valor direto (limitado à comida); cupom % desconta o percentual
const descontoCupomAtual = () => { if(!cupomInfo) return 0;
  if(cupomInfo.valor!=null) return Math.min(cupomInfo.valor, totais().t);
  return Math.round(totais().t * (cupomInfo.pct||0))/100; };
async function aplicarCupom(){
  const el = document.getElementById("cupom-input");
  const cod = (el?.value||"").trim().toUpperCase();
  const msg = document.getElementById("cupom-msg");
  if(!cod){ cupom=""; cupomInfo=null; reabrirSacola(); return; }
  msg.className="mp-note"; msg.textContent="conferindo...";
  try{
    const r = await fetch(`${RIO_API}/validar-cupom`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({cupom:cod, subtotal:totais().t})});
    const d = await r.json();
    if(d.ok){ cupom=cod; cupomInfo={pct:d.desconto_pct, valor:(d.promo && !d.desconto_pct)?d.desconto:null, nome:d.nome, primeiro:!!d.primeiro_pedido}; usarPontos=false; reabrirSacola();
      if(d.primeiro_pedido && !sessao){ const m2=document.getElementById("cupom-msg"); if(m2){ m2.className="mp-note"; m2.textContent="✨ esse cupom é pra quem tem conta — entra ali em cima pra valer no pagamento."; } } }
    else { cupom=""; cupomInfo=null; reabrirSacola();
      const m=document.getElementById("cupom-msg"); if(m){ m.className="cupom-erro"; m.textContent=d.motivo||"cupom inválido"; } }
  }catch(e){ const m=document.getElementById("cupom-msg"); if(m){ m.className="cupom-erro"; m.textContent="não deu pra conferir agora"; } }
}

async function carregarConta(){
  const {data:{session}} = await sb.auth.getSession();
  sessao = session;
  if(!sessao){ perfil=null; extrato=[]; saldoPts=0; usarPontos=false; syncConta(); return; }
  const uid = sessao.user.id;
  const [{data:p},{data:e},{data:af}] = await Promise.all([
    sb.from("clientes").select("*").eq("id",uid).maybeSingle(),
    sb.from("pontos").select("delta,motivo,created_at").eq("cliente_id",uid).order("created_at",{ascending:false}),
    sb.from("afiliados").select("codigo").eq("cliente_id",uid).eq("tipo","cliente").maybeSingle(),
  ]);
  perfil = p||null; extrato = e||[];
  saldoPts = extrato.reduce((s,x)=>s+x.delta,0);
  meuCodigo = af?.codigo || null;
  meusIndicados = extrato.filter(x=>x.motivo==="indicação de amigo 🎉").length;
  if(perfil){
    cliente = {nome:perfil.nome||cliente.nome||"", zap:perfil.whatsapp||cliente.zap||"",
      endereco:perfil.endereco||cliente.endereco||"", bairro:perfil.bairro||cliente.bairro||""};
    if(cliente.bairro && FRETES_EXISTE(cliente.bairro)) bairro = cliente.bairro;
    localStorage.setItem("rs_cliente", JSON.stringify(cliente));
  }
  syncConta();
}

    ? `<img class="av" src="${esc(foto)}" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'av ini',textContent:'${ini}'}))">`
    : `<span class="av ini">${ini}</span>`;

async function contaSubmit(btn){
  const v=id=>(document.getElementById(id)?.value||"").trim();

  const promo=document.getElementById("ac-promo")?.checked||false;

    ? await sb.auth.signUp({email, password:senha, options:{data:{nome, aceita_promo:promo, ...(ref?{ref}:{})}}})
    : await sb.auth.signInWithPassword({email, password:senha});
  if(!r.error && modoConta==="criar") localStorage.removeItem("rs_ref");
  if(r.error){
    btn.disabled=false; btn.textContent = modoConta==="criar"?"Criar conta · ganhar 100 pts 🎁":"Entrar";

      : /invalid/i.test(r.error.message) ? "E-mail ou senha não conferem. 🤔"
      : "Não rolou: "+r.error.message;

  const erro=document.getElementById("ac-erro");
  const r = await sb.auth.signInWithOAuth({provider:"google"});
  if(r.error){ if(r.error.message&&erro) erro.textContent="Não rolou o Google: "+r.error.message; return; }
  await carregarConta();
  abrirConta();
}
async function esqueciSenha(){
  const email=(document.getElementById("ac-email")?.value||"").trim();
  const erro=document.getElementById("ac-erro");
  if(!email){ erro.textContent="Escreve seu e-mail aí em cima que a gente manda o link. ☝️"; return; }
  erro.style.color="var(--verde)"; erro.textContent="Enviando...";
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo:"https://coletivo.app/riosando/"});
  if(error){
    erro.style.color="var(--vermelho)";
    erro.textContent = /rate|seconds/i.test(error.message) ? "Calma, já enviamos — espera 1 minuto e olha o e-mail. 📬" : "Não conseguimos enviar agora — tenta de novo em instantes.";
    return;
  }
  erro.textContent=`📬 Link enviado pra ${email} — abre o e-mail (olha o spam) e clica pra criar uma senha nova.`;
}
// cliente clicou no link do e-mail → tela de nova senha
function abrirNovaSenha(){
  const sheet=document.getElementById("sheet");
  sheet.innerHTML = `
    <div class="sheet-head"><h2>Nova senha</h2><button class="fechar" onclick="fecharSheet()">✕</button></div>
    <label>Escolhe a senha nova</label>
    <input type="password" id="ns-1" autocomplete="new-password" placeholder="mínimo 6 caracteres">
    <label>Repete ela</label>
    <input type="password" id="ns-2" autocomplete="new-password">
    <button class="pagar" onclick="salvarNovaSenha(this)">Salvar senha nova</button>
    <div class="mp-note" id="ns-erro" style="color:var(--vermelho)"></div>`;
  sheet.classList.add("on");
  document.getElementById("overlay").classList.add("on");
}
async function salvarNovaSenha(btn){
  const s1=document.getElementById("ns-1").value, s2=document.getElementById("ns-2").value;
  const erro=document.getElementById("ns-erro");
  if(s1.length<6){ erro.textContent="Mínimo 6 caracteres. 🙏"; return; }
  if(s1!==s2){ erro.textContent="As duas não bateram — confere?"; return; }
  btn.disabled=true; btn.textContent="Salvando...";
  const {error} = await sb.auth.updateUser({password:s1});
  if(error){ btn.disabled=false; btn.textContent="Salvar senha nova"; erro.textContent="Não rolou: "+error.message; return; }
  await carregarConta();
  abrirConta();
}
async function salvarPerfil(btn){
  const v=id=>(document.getElementById(id)?.value||"").trim();
  const dados={id:sessao.user.id, nome:v("pf-nome"), whatsapp:v("pf-zap"), endereco:v("pf-endereco"), bairro:v("pf-bairro")||null, aceita_promo:document.getElementById("pf-promo")?.checked||false};
  btn.disabled=true;
  const {error} = await sb.from("clientes").upsert(dados);
  btn.disabled=false;
  document.getElementById("pf-ok").textContent = error ? "Não salvou — tenta de novo?" : "✓ Salvo! Seus pedidos já vêm preenchidos.";
  if(!error){
    perfil={...(perfil||{}), ...dados};
    cliente={nome:dados.nome, zap:dados.whatsapp, endereco:dados.endereco, bairro:dados.bairro||"", cep:v("pf-cep")};
    if(cliente.bairro && FRETES_EXISTE(cliente.bairro)) bairro=cliente.bairro;
    localStorage.setItem("rs_cliente", JSON.stringify(cliente));
    const n1=(dados.nome||"").split(" ")[0];
    if(n1) document.querySelector(".sheet-head h2").textContent=`Olá, ${n1}`;
  }
}
async function carregarHistorico(){
  const {data} = await sb.from("pedidos").select("codigo,status,total,created_at")
    .eq("user_id", sessao.user.id).order("created_at",{ascending:false}).limit(5);
  const el=document.getElementById("hist");
  if(!el) return;
  if(!data?.length){ el.textContent="Nenhum pedido ainda — bora estrear? 🥪"; return; }
  const ROTULO={novo:"recebido",em_preparo:"no fogo",pronto:"pronto",saiu:"a caminho",entregue:"entregue ✅",cancelado:"cancelado"};
  el.innerHTML = data.map(p=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 2px;border-bottom:1px solid var(--linha)">
    <a href="?pedido=${p.codigo}" style="color:var(--verde)">#${p.codigo}</a>
    <span style="opacity:.7">${new Date(p.created_at).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} · ${ROTULO[p.status]||p.status}</span>
    <b>${fmt(Number(p.total))}</b></div>`).join("");
}
async function sairConta(){
  await sb.auth.signOut();
  fecharSheet();
}
async function compartilharConvite(btn){
  if(!meuCodigo) return;
  const link = `https://coletivo.app/riosando/?ref=${meuCodigo}`;
  const msg = `Pede um katsu sando do Rio Sandô com meu código ${meuCodigo} e ganha 50 pontos (R$ 2,50) de bônus 🥪⛩️\n${link}`;
  try{
    if(navigator.share){ await navigator.share({title:"Rio Sandô", text:msg, url:link}); return; }
  }catch(e){ if(e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(msg); btn.textContent="✓ Convite copiado — cola no WhatsApp"; }
  catch(e){ window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,"_blank"); }
}
sb.auth.onAuthStateChange((ev)=>{
  if(ev==="PASSWORD_RECOVERY"){ carregarConta().then(abrirNovaSenha); return; }
  if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="INITIAL_SESSION") carregarConta();
});
function fecharTudo(){ cart={}; localStorage.removeItem("rs_cart"); render(); fecharSheet(); }

// ── pagamento embutido (Mercado Pago Payment Brick) ──
let brickAtivo = null;
async function abrirPagamento(pedido, valor){
  const sheet=document.getElementById("sheet");
  sheet.innerHTML = `
    <div class="sheet-head"><h2>Pagamento · ${fmt(valor)}</h2><button class="fechar" onclick="abrirSacola()">←</button></div>
    <div id="pay-erro"></div>
    <div id="pay-brick"><div class="vazio">carregando pagamento seguro...</div></div>
    <div class="mp-note">Pagamento processado pelo Mercado Pago 🔒</div>`;
  const mp = new MercadoPago(MP_PUBLIC_KEY, {locale:"pt-BR"});
  if(brickAtivo){ try{ brickAtivo.unmount(); }catch(e){} }
  brickAtivo = await mp.bricks().create("payment","pay-brick",{
    initialization:{ amount: valor },
    customization:{
      paymentMethods:{ pix:"all", creditCard:"all", debitCard:"all" },
      visual:{ style:{ theme:"default", customVariables:{
        baseColor:"#C0392B", borderRadiusMedium:"12px",
      }}},
    },
    callbacks:{
      onReady: ()=>{ document.querySelector("#pay-brick .vazio")?.remove(); },
      onError: (e)=>{ console.error(e); },
      onSubmit: async ({formData})=>{
        limparPagamentoErro();
        const user_token = (await sb.auth.getSession()).data.session?.access_token ?? null;
        const r = await fetch(`${RIO_API}/mp-processar-pagamento`,{
          method:"POST", headers:{"Content-Type":"application/json", ...(user_token?{Authorization:`Bearer ${user_token}`}:{})},
          body:JSON.stringify({pedido, formData})});
        const d = await r.json();
        // erro do servidor (não conseguiu nem criar o pagamento) — NÃO limpa a sacola
        if(!r.ok){ mostrarPagamentoErro(traduzErroMP(d.detalhe||d.erro)); throw new Error(d.erro||"falhou"); }
        // cartão RECUSADO — mantém a sacola pra tentar de novo, mostra erro claro
        if(d.status==="rejected" || d.status==="cancelled"){ mostrarPagamentoErro(traduzErroMP(d.status_detail)); throw new Error("recusado"); }
        // daqui pra baixo = pedido colocado (aprovado ou Pix pendente): aí sim limpa
        cart={}; localStorage.removeItem("rs_cart"); localStorage.removeItem("rs_cupom_url"); usarPontos=false; cupom=""; cupomInfo=null; render();
        if(sessao) carregarConta();
        localStorage.setItem("rs_ultimo", JSON.stringify({codigo:pedido.codigo, quando:Date.now()}));
        if(d.status==="approved"){ location.href=`?pedido=${pedido.codigo}`; }
        else if(d.pix){ mostrarPix(pedido.codigo, d.pix, valor); }
        else { location.href=`?pedido=${pedido.codigo}`; }
      },
    },
  });
}
// traduz o código de recusa do Mercado Pago pra algo que o cliente entende
function traduzErroMP(codigo){
  const m = {
    cc_rejected_bad_filled_security_code: "o código de segurança (CVV) do cartão está errado.",
    cc_rejected_bad_filled_date: "a data de validade do cartão está errada.",
    cc_rejected_bad_filled_card_number: "o número do cartão está errado.",
    cc_rejected_bad_filled_other: "algum dado do cartão está errado — confere e tenta de novo.",
    cc_rejected_insufficient_amount: "saldo ou limite insuficiente nesse cartão.",
    cc_rejected_call_for_authorize: "seu banco pediu pra autorizar esta compra — ligue no banco e tente de novo, ou use Pix.",
    cc_rejected_card_disabled: "esse cartão está desabilitado — fale com o banco ou use outro.",
    cc_rejected_high_risk: "o pagamento foi recusado por segurança — tente outro cartão ou pague com Pix.",
    cc_rejected_max_attempts: "muitas tentativas nesse cartão — tente outro ou pague com Pix.",
    cc_rejected_duplicated_payment: "esse pagamento parece duplicado — confere se já não pagou.",
    cc_rejected_card_type_not_allowed: "esse tipo de cartão não é aceito — tente outro ou Pix.",
    cc_rejected_blacklist: "o pagamento foi recusado — tente outro cartão ou Pix.",
  };
  return m[codigo] || "o cartão foi recusado. Confere os dados e tenta de novo, ou pague com Pix. 🙏";
}
function limparPagamentoErro(){ const el=document.getElementById("pay-erro"); if(el) el.innerHTML=""; }
function mostrarPagamentoErro(msg){
  const el=document.getElementById("pay-erro");
  if(!el) return;
  el.innerHTML = `<div style="background:rgba(192,57,43,.1);border:1px solid var(--vermelho);border-radius:12px;padding:14px 16px;margin-bottom:14px;color:var(--vermelho);font-size:14px;line-height:1.5">
    <b>Cartão não aprovado</b> — nada foi cobrado.<br>${msg}<br>
    <span style="opacity:.85">Você pode tentar outro cartão abaixo, ou trocar pra <b>Pix</b> na opção do formulário.</span></div>`;
  el.scrollIntoView({behavior:"smooth",block:"center"});
}
function mostrarPix(codigo, pix, valor){
  const sheet=document.getElementById("sheet");
  sheet.innerHTML = `
    <div class="sheet-head"><h2>Pix · ${fmt(valor)}</h2><button class="fechar" onclick="location.href='?pedido=${codigo}'">✕</button></div>
    <div class="ok-box" style="padding-top:8px">
      <img src="data:image/png;base64,${pix.qr_code_base64}" alt="QR Pix" style="width:200px;height:200px;border-radius:12px;border:1px solid var(--linha)">
      <p style="margin-top:10px">Escaneia o QR no app do banco,<br>ou copia o código:</p>
      <textarea id="pix-copia" readonly rows="3" style="margin-top:10px;font-size:12px">${pix.qr_code}</textarea>
      <button class="pagar" style="margin-top:10px" onclick="navigator.clipboard.writeText(document.getElementById('pix-copia').value).then(()=>{this.textContent='✓ Copiado — cola no app do banco'})">📋 Copiar código Pix</button>
      <div class="mp-note" id="pix-aguardando">aguardando pagamento...</div>
    </div>`;
  (async function poll(){
    try{
      const r = await fetch(`${RIO_API}/pedido-status`,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({codigo})});
      const p = await r.json();
      if(p.pagamento_status==="pago"){ location.href=`?pedido=${codigo}`; return; }
    }catch(e){}
    setTimeout(poll, 5000);
  })();
}
render();
aplicarCupomURL();

// novidades do app (subir o id a cada atualização — quem já viu não vê de novo)
const NOVIDADES = {id:2, itens:[
  "⭐ <b>Chegou o programa de pontos!</b> Crie sua conta, ganhe 100 pontos de presente (= R$ 5) e troque pontos por desconto direto na sacola.",
]};
function fecharNews(){
  localStorage.setItem("rs_news_visto", NOVIDADES.id);
  document.getElementById("news").style.display="none";
}
(function(){

    + NOVIDADES.itens.map(i=>`<div style="margin-top:7px">${i}</div>`).join("");

// header: status aberto/fechado + atalho pro último pedido
(function(){
  if(!lojaAberta()){
    document.getElementById("status-dot").classList.add("off");
    const b=document.getElementById("fechado-banner");
    b.style.display="block";
    b.innerHTML=`🕐 Fechados agora — mas pode pedir: entra <b>agendado pra ${rotuloAbertura()}</b>.`;
  }

  }
})();

// página de status do pedido (?pedido=CODIGO) — atualiza sozinha a cada 15s
(function(){
  const q = new URLSearchParams(location.search);
  const codigo = q.get("pedido");
  if(!codigo) return;
  const ETAPAS = [
    ["novo","Pedido recebido","A cozinha já sabe de você"],
    ["em_preparo","No fogo 🔪","Seu sando está sendo montado"],
    ["pronto","Prontinho 📦","Embalado, esperando o entregador"],
    ["saiu","Saiu pra entrega 🛵","O sando está a caminho"],
    ["entregue","Entregue ✅","Bom apetite! Arigatô 🙏"],
  ];
  async function atualizar(){
    try{
      const r = await fetch(`${RIO_API}/pedido-status`,{
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({codigo})});
      const p = await r.json();
      const sheet=document.getElementById("sheet");
      if(!r.ok){ sheet.innerHTML=`<div class="sheet-head"><h2>Pedido #${codigo}</h2><button class="fechar" onclick="location.href=location.pathname">✕</button></div><div class="vazio">Não achamos esse pedido. 🤔</div>`; return; }
      const etapas = p.modo==="retirada" ? ETAPAS.filter(e=>e[0]!=="saiu").map(e=>e[0]==="pronto"?["pronto","Prontinho 📦","Pode vir buscar em Botafogo!"]:e) : ETAPAS;
      const idx = Math.max(0, etapas.findIndex(e=>e[0]===p.status));
      const cancelado = p.status==="cancelado";
      sheet.innerHTML = `
        <div class="sheet-head"><h2>Pedido #${p.codigo}</h2><button class="fechar" onclick="location.href=location.pathname">✕</button></div>
        ${cancelado?`<div class="vazio">Esse pedido foi cancelado. <a href="https://wa.me/${ZAP_LOJA}" target="_blank" style="color:var(--verde)">Chama a gente no WhatsApp</a> se precisar. 🙏</div>`:`
        ${p.pagamento_status==="pendente"?`<div class="mp-note" style="color:var(--vermelho)">aguardando confirmação do pagamento...</div>`:""}
        <div style="padding:8px 2px">
        ${etapas.map((e,i)=>`
          <div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0;opacity:${i<=idx?1:.35}">
            <span style="font-size:18px">${i<idx?"✅":i===idx?"🔴":"⚪️"}</span>
            <div><b style="font-size:15px">${e[1]}</b><br><small style="opacity:.6">${e[2]}</small></div>
          </div>`).join("")}
        </div>
        ${p.entrega_tracking_url && /^https:\/\//.test(p.entrega_tracking_url)?`<button class="pagar" onclick="window.open('${esc(p.entrega_tracking_url)}','_blank')">Ver o entregador no mapa 🗺️</button>`:""}
        <div class="mp-note">atualiza sozinho · ${new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div>`}`;
      sheet.classList.add("on");
      document.getElementById("overlay").classList.add("on");
      if(!cancelado && p.status!=="entregue") setTimeout(atualizar, 15000);
    }catch(e){ setTimeout(atualizar, 20000); }
  }
  atualizar();
})();

// retorno do Checkout Pro (?pago=1|0|pendente&codigo=XXXX)
(function(){
  const q = new URLSearchParams(location.search);
  if(!q.has("pago")) return;
  const codigo = q.get("codigo")||"", ok = q.get("pago");
  history.replaceState(null,"",location.pathname);
  const sheet=document.getElementById("sheet");
  sheet.innerHTML = ok==="1" ? `
    <div class="sheet-head"><h2>Pagamento confirmado</h2><button class="fechar" onclick="fecharSheet()">✕</button></div>
    <div class="ok-box"><span class="osym"></span>
      <h3>Arigatô! 🙏</h3>
      <p>Pedido <strong>#${codigo}</strong> pago e já na fila da cozinha.</p>
      <button class="pagar" style="margin-top:18px" onclick="location.href='?pedido=${codigo}'">Acompanhar meu pedido 🛵</button></div>`
  : ok==="pendente" ? `
    <div class="sheet-head"><h2>Quase lá</h2><button class="fechar" onclick="fecharSheet()">✕</button></div>
    <div class="ok-box"><span class="osym"></span>
      <h3>Pagamento em processamento</h3>
      <p>Assim que o Mercado Pago confirmar, o pedido <strong>#${codigo}</strong> entra na fila da cozinha.</p></div>`
  : `
    <div class="sheet-head"><h2>Não rolou 😕</h2><button class="fechar" onclick="fecharSheet()">✕</button></div>
    <div class="ok-box"><span class="osym"></span>
      <h3>Pagamento não aprovado</h3>
      <p>Nenhum valor foi cobrado. Tenta de novo, ou escolhe pagar na entrega.</p></div>`;
  sheet.classList.add("on");
  document.getElementById("overlay").classList.add("on");
})();
