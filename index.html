<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coletivo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Futura,'Century Gothic','Jost',sans-serif;
    background:#141414;color:#F5F0EB;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;
  }
  .wordmark{font-size:15vw;font-weight:500;letter-spacing:.04em;line-height:1}
  @media(min-width:600px){.wordmark{font-size:88px}}
  .wordmark span{color:#C0392B}
  .tag{margin-top:14px;font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.45}
  .cards{margin-top:56px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
  a.card{
    display:flex;align-items:center;justify-content:space-between;
    text-decoration:none;color:#F5F0EB;
    border:1px solid rgba(245,240,235,.18);border-radius:16px;
    padding:20px 22px;transition:.15s;
  }
  a.card:hover{border-color:#C0392B;transform:translateY(-2px)}
  .card b{font-size:17px;font-weight:500;letter-spacing:.05em}
  .card small{display:block;font-size:12px;opacity:.5;margin-top:4px}
  .card .seta{font-size:20px;opacity:.6}
  .breve{
    border:1px dashed rgba(245,240,235,.15);border-radius:16px;
    padding:20px 22px;font-size:13px;opacity:.35;letter-spacing:.08em;text-align:center;
  }
  footer{margin-top:64px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;opacity:.25}
</style>
</head>
<body>
  <div class="wordmark">c<span>o</span>letivo</div>
  <div class="tag">iniciativas que dividem a mesa</div>
  <div class="cards">
    <a class="card" href="/riosando/">
      <div><b>RIO SANDÔ</b><small>katsu sando japonês · Botafogo, Rio</small></div>
      <span class="seta">→</span>
    </a>
    <div class="breve">em breve, mais um lugar na mesa</div>
  </div>
  <footer>coletivo.app</footer>
</body>
</html>
